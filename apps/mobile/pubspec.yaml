name: studafy_mobile
description: "Studafy's Flutter mobile application shell."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  google_fonts: ^6.3.2
  dio: ^5.11.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  web_socket_channel: ^3.0.3
  # 10.x, deliberately not 11: 10 migrates what 9 stored (EncryptedSharedPreferences, old ciphers) to
  # its own cipher storage on first read, so signed-in users stay signed in; 11 removed that
  # migration and would drop data saved by 9. Upgrade to 11 only after a release on 10 has run.
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  app_links: ^6.3.0
  url_launcher: ^6.3.1
  easy_localization: ^3.0.8
  intl: ^0.20.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1
  firebase_crashlytics: ^4.3.10
  # 9.x: 8.x pinned Kotlin language version 1.6, which this app's Kotlin 2.3 refuses to compile;
  # 10.x requires minSdk 26 and would drop Android 7 devices the app still supports (minSdk 24).
  sentry_flutter: ^9.30.1
  # 10.x needs win32 ^6, like file_picker 13 -- which is why flutter_secure_storage is on 10 too.
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^18.0.1
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.35
  path_provider: ^2.1.6
  path: ^1.9.1
  # 13.x: with 11.x the Android build failed (FilePickerPlugin not found in the generated plugin
  # registrant); 13 ships its Android side as the separate android_file_picker package.
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  mime: ^2.0.0
  flutter_pdfview: ^1.4.5
  flutter_web_auth_2: ^5.1.0
  flutter_svg: ^2.3.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ST-247's integration_test suite (apps/mobile/integration_test/). Ships with the Flutter SDK
  # (no pub.dev version to pin) and provides both the on-device test binding `flutter test
  # integration_test/` needs and the Android/iOS native test-runner glue a device farm drives.
  integration_test:
    sdk: flutter
  # ST-247: the AI-upsell integration test intercepts `launchUrl` by swapping this platform
  # interface for a recording fake, instead of actually opening a system browser mid-suite.
  url_launcher_platform_interface: ^2.3.2
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.9
  json_serializable: ^6.14.1
  swagger_parser: ^1.44.1
  test: ^1.31.0
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Medium.ttf
    - assets/fonts/Inter-SemiBold.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/translations/
    - assets/brand/
  # Arabic script fallback (IBM Plex Sans Arabic, SIL OFL 1.1 — see
  # assets/fonts/IBMPlexSansArabic-OFL.txt). Inter has no Arabic glyphs, so AppTypography lists
  # this family as `fontFamilyFallback`: Latin keeps rendering in Inter, Arabic in Plex.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# Drives `dart run scripts/generate_api_client.dart` (ST-062): generates a typed Dio/Retrofit
# client from the OpenAPI 3.1 document that ST-060 emits at apps/api/openapi.json. Output is
# gitignored — see lib/src/core/api/README.md and docs/runbooks/merge-conflicts-generated-files.md.
swagger_parser:
  schema_path: ../api/openapi.json
  output_directory: lib/src/core/api/generated
  name: studafy_api
  root_client_name: StudafyApiClient
  # "Finance" and "Approval Queue" hit unrelated swagger_parser 1.44.1 codegen bugs the API
  # surface can't work around (a oneOf request body resolving to the wrong generated class, and
  # an unstable name-collision rename between two schemas both called "Grades"). See
  # lib/src/core/api/README.md#known-generation-gaps.
  #
  # "AI" is excluded for a structural reason, not a codegen bug: the /api/ai/students/{studentId}/ask
  # endpoint responds with a `text/event-stream` `oneOf` (an SSE event union) that a Retrofit-style
  # typed client cannot model — swagger_parser emits an `askAiStreaming` method returning a sealed
  # union whose file it never writes, breaking the whole client's compile. Every /api/ai/ surface
  # the mobile app uses is served by a hand-written Dio client instead (features/ai/data/*), so
  # dropping the tag from codegen matches how the feature is already built.
  #
  # "Grade Entry" and "Grade Workflow" hit the same 1.44.1 name-collision bug as "Approval Queue":
  # the ST-113 `Grade` schema (id / score / max_score / label / updated_at) is silently generated
  # with the body of an unrelated published-grades summary, so `GradebookEntryList` can't
  # deserialise a real response. Both tags are served by a hand-written Dio client instead
  # (features/teacher/data/grade_entry_client.dart), same as the AI surface.
  exclude_tags:
    - Finance
    - Approval Queue
    - AI
    - Grade Entry
    - Grade Workflow
