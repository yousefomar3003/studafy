pre-commit:
  parallel: true
  commands:
    lint-staged:
      run: node_modules/.bin/lint-staged
    # Mobile is excluded for the same reason CI excludes it (.github/workflows/ci.yml): its
    # check-types is `flutter analyze`, which needs the Flutter SDK. Without this the hook is
    # stricter than CI and unrunnable for anyone who does not have Flutter installed — and it bites
    # on any change to a root file (turbo.json, bun.lock), since that puts every package in scope.
    check-types:
      glob: "*.{ts,tsx,mts,cts}"
      run: node_modules/.bin/turbo run check-types --filter="[HEAD]" --filter=!@studafy/mobile

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}

# Mirrors the fast half of CI (.github/workflows/ci.yml's "quality" job: format, lint, check-types,
# test, build, plus the OpenAPI/client/permission-matrix drift checks) so those failures surface
# before the push instead of a few minutes later in a red CI run. Deliberately does not run the
# database-migrations or containers jobs here -- those need Docker/Postgres and take minutes, which
# would make every push slow. Run them on demand with `bun run ci:local:db` /
# `bun run ci:local:containers` instead.
pre-push:
  commands:
    ci-local:
      run: bun run ci:local
