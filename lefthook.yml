pre-commit:
  parallel: true
  commands:
    lint-staged:
      run: node_modules/.bin/lint-staged

    check-types:
      glob: "*.{ts,tsx,mts,cts}"
      run: node_modules/.bin/turbo run check-types --filter="[HEAD]" --filter=!@studafy/mobile

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: |
        bun run format:check
        bun run lint
        bun run typecheck
        bun run test
        bun run build
