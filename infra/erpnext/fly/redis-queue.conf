# Frappe's queue Redis (common_site_config redis_queue and redis_socketio): the RQ background job
# queue. Jobs must not be dropped, so it never evicts (writes fail at the limit instead) and keeps
# an append-only file on the volume, so queued jobs survive a restart.
bind 127.0.0.1
port 11000
protected-mode yes
daemonize no
supervised no
logfile ""
dir /data/redis-queue
save ""
appendonly yes
appendfsync everysec
maxmemory 64mb
maxmemory-policy noeviction
