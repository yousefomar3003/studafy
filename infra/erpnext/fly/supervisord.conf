; Every process on the all-in-one ERPNext machine (docs/plans/erpnext-fly.md). Started by
; entrypoint.sh as root; each program drops to its own user. Every program writes to the
; container's stdout/stderr, which fly (and the log shipper) collect.
;
; Order: MariaDB and Redis first (priority 10), then the bench programs (20), then the agent (30).
; supervisord does not wait for readiness between priorities, so the bench programs and the agent
; start through wait-for-services.sh, which holds them until MariaDB and both Redis are up. On
; shutdown supervisord stops them in reverse order: the agent and the bench programs before Redis
; and MariaDB.
;
; Nothing here (or in entrypoint.sh) runs `bench migrate` or otherwise changes a site's schema:
; upgrades run `bench --site all migrate` by hand (docs/runbooks/erpnext-fly.md), which the deploy
; rollback relies on.
;
; Operators: `supervisorctl status`, `supervisorctl restart web` (as root, e.g. fly ssh console).

[supervisord]
nodaemon = true
user = root
; In the foreground supervisord already writes its own log to stdout; a logfile of /dev/stdout
; would print every line twice.
logfile = /dev/null
logfile_maxbytes = 0
loglevel = info
pidfile = /run/supervisord.pid

; Root-only socket for supervisorctl. supervisord logs a CRIT that it has no HTTP authentication;
; the 0700 socket is the access control.
[unix_http_server]
file = /run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///run/supervisor.sock

; ---- data stores -------------------------------------------------------------------------------

[program:mariadb]
command = /usr/sbin/mariadbd --defaults-file=/etc/erpnext-fly/mariadb.cnf
user = mysql
priority = 10
autorestart = true
startsecs = 5
startretries = 30
; A clean InnoDB shutdown flushes the buffer pool; give it time rather than SIGKILL it.
stopsignal = TERM
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:redis-cache]
command = /usr/bin/redis-server /etc/erpnext-fly/redis-cache.conf
user = redis
priority = 10
autorestart = true
startsecs = 2
startretries = 30
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:redis-queue]
command = /usr/bin/redis-server /etc/erpnext-fly/redis-queue.conf
user = redis
priority = 10
autorestart = true
startsecs = 2
startretries = 30
stopwaitsecs = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

; `supervisorctl restart redis:*` restarts both.
[group:redis]
programs = redis-cache,redis-queue
priority = 10

; ---- bench -------------------------------------------------------------------------------------
; HOME/USER: supervisord changes the uid but not the environment it inherited from root.

[program:web]
; No default site: frappe.app picks the site from the Host header (X-Frappe-Site-Name wins if a
; caller sends it), and an unknown host gets a 404. --preload shares the imported framework
; between the two workers; --max-requests recycles a worker before slow leaks add up on 2 GB.
command = /etc/erpnext-fly/wait-for-services.sh
    /home/frappe/frappe-bench/env/bin/gunicorn
    --chdir=/home/frappe/frappe-bench/sites
    --bind=0.0.0.0:8000
    --worker-class=gthread --workers=2 --threads=4
    --timeout=120 --graceful-timeout=20
    --worker-tmp-dir=/dev/shm
    --max-requests=5000 --max-requests-jitter=500
    --preload
    frappe.app:application
user = frappe
directory = /home/frappe/frappe-bench/sites
environment = HOME="/home/frappe",USER="frappe"
priority = 20
autorestart = true
startsecs = 5
startretries = 30
stopsignal = TERM
stopwaitsecs = 25
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:worker]
command = /etc/erpnext-fly/wait-for-services.sh bench worker --queue short,default,long
user = frappe
directory = /home/frappe/frappe-bench
environment = HOME="/home/frappe",USER="frappe"
priority = 20
autorestart = true
startsecs = 5
startretries = 30
; RQ finishes the job in hand on TERM (warm shutdown).
stopsignal = TERM
stopwaitsecs = 30
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:schedule]
command = /etc/erpnext-fly/wait-for-services.sh bench schedule
user = frappe
directory = /home/frappe/frappe-bench
environment = HOME="/home/frappe",USER="frappe"
priority = 20
autorestart = true
startsecs = 5
startretries = 30
stopsignal = TERM
stopwaitsecs = 10
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

; ---- site agent (infra/erpnext/agent) ----------------------------------------------------------

; The agent shells out to bench (/usr/local/bin) and rclone (/usr/bin): PATH comes from the image.
[program:agent]
command = /etc/erpnext-fly/wait-for-services.sh /home/frappe/frappe-bench/env/bin/python -m erpnext_agent
user = frappe
directory = /home/frappe/frappe-bench/sites
environment = HOME="/home/frappe",USER="frappe"
priority = 30
autorestart = true
startsecs = 5
startretries = 30
stopsignal = TERM
stopwaitsecs = 35
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
