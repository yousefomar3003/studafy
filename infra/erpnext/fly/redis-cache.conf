# Frappe's cache Redis (common_site_config redis_cache). A cache: nothing on disk, and it evicts
# the least recently used keys at its limit instead of refusing writes.
bind 127.0.0.1
port 13000
protected-mode yes
daemonize no
supervised no
logfile ""
dir /tmp
save ""
appendonly no
maxmemory 64mb
maxmemory-policy allkeys-lru
