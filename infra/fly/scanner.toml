# ClamAV for the workers' file-scan queue, on fly.io (production). On AWS clamd is a sidecar bound to
# 127.0.0.1; here it is its own app, so it binds every interface and is reachable only through its
# Flycast (private) address — it has no public IP. Deploy from the repo root:
#   fly deploy . --config infra/fly/scanner.toml --remote-only
app = "studafy-core-scanner"
primary_region = "fra"

[build]
  dockerfile = "../docker/clamav.Dockerfile"

  [build.args]
    CLAMAV_TCP_ADDRS = "0.0.0.0 ::"

[[services]]
  internal_port = 3310
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 3310

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    # freshclam and the signature load take a couple of minutes on first boot.
    grace_period = "5m"

# The ~1.5 GB signature database plus clamd itself; ConcurrentDatabaseReload is off (Dockerfile),
# so a reload never holds two copies.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
