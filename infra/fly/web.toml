# Studafy web app on fly.io (production): the static build behind nginx. It serves the marketing site
# and the school portal on studafy.com, www, app and school.studafy.com (README: Domains). The Vite
# settings are baked in at build time. VITE_TURNSTILE_SITE_KEY is public but kept out of
# the repository, so the deploy workflow passes it from the prod environment. By hand, from the repo root:
#   fly deploy . --config infra/fly/web.toml --remote-only \
#     --build-arg VITE_TURNSTILE_SITE_KEY=<site key>
app = "studafy-core-web"
primary_region = "fra"

[build]
  dockerfile = "../docker/web.Dockerfile"

  [build.args]
    VITE_API_BASE_URL = "https://api.studafy.com"
    VITE_REALTIME_BASE_URL = "wss://api.studafy.com"
    VITE_SENTRY_ENVIRONMENT = "production"
    # Every page names its studafy.com address as canonical, whichever of the four hosts served it.
    VITE_SITE_ORIGIN = "https://studafy.com"
    VITE_MARKETING_CONTACT_EMAIL = "hello@studafy.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
