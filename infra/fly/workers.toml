# Studafy background workers on fly.io (production): queues only, no inbound traffic. Deploy from
# the repo root:
#   fly deploy . --config infra/fly/workers.toml --remote-only
app = "studafy-core-workers"
primary_region = "fra"

[build]
  dockerfile = "../docker/workers.Dockerfile"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "workers"
  SENTRY_ENVIRONMENT = "production"
  FRONTEND_URL = "https://app.studafy.com"
  DATABASE_HOST = "aws-1-eu-central-1.pooler.supabase.com"
  DATABASE_PORT = "6543"
  DATABASE_NAME = "postgres"
  # Every pool verifies the pooler's certificate; Bun adds Supabase's root CA (written below) to
  # its trust store.
  DATABASE_SSL_MODE = "verify-full"
  NODE_EXTRA_CA_CERTS = "/etc/studafy/supabase-ca.pem"
  S3_REGION = "auto"
  S3_APP_FILES_BUCKET = "studafy-prod-files"
  # The AWS SDK's own credential chain reads the R2 keys from AWS_ACCESS_KEY_ID/SECRET (secrets).
  AWS_REGION = "auto"
  # clamd runs as its own app, reached over the organisation's private network (scanner.toml).
  CLAMAV_HOST = "studafy-core-scanner.flycast"
  CLAMAV_PORT = "3310"
  AI_LLM_PROVIDER = "openai-compatible"
  AI_LLM_BASE_URL = "https://api.together.xyz/v1"
  EMAIL_PROVIDER = "resend"
  SES_FROM_ADDRESS = "no-reply@studafy.com"
  SES_FROM_NAME = "Studafy"
  EMAIL_DRY_RUN = "false"
  PUSH_DRY_RUN = "false"
  # The cost report publishes to CloudWatch, which this deployment does not have.
  COST_REPORT_ENABLED = "false"

# Supabase's root CA, from the base64 secret SUPABASE_CA_CERT_B64 (fly files from secrets are
# base64), written before the process starts so NODE_EXTRA_CA_CERTS can load it.
[[files]]
  guest_path = "/etc/studafy/supabase-ca.pem"
  secret_name = "SUPABASE_CA_CERT_B64"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
