# Database migrations for fly.io (production). This app never serves anything: its image is built
# and pushed, then run once as a throwaway machine, which reads the app's secrets and exits:
#   fly deploy . --config infra/fly/migrate.toml --remote-only --build-only --push --image-label <tag>
#   fly machine run registry.fly.io/studafy-core-migrate:<tag> --app studafy-core-migrate \
#     --region fra --rm --restart no <the --env flags in README "Deploying">
# Secrets: DATABASE_PASSWORD and DATABASE_CA_CERT.
# It connects to the database directly (IPv6, which fly machines have), not through a pooler: a
# pooled server session can predate the role setting the migrations depend on (README "Database
# connections"). `fly machine run` does not read [env], so pass these as --env flags.
app = "studafy-core-migrate"
primary_region = "fra"

[build]
  dockerfile = "../docker/migrations.Dockerfile"

[env]
  NODE_ENV = "production"
  DATABASE_HOST = "db.pmrzcugyvviupfjzrrye.supabase.co"
  DATABASE_PORT = "5432"
  DATABASE_NAME = "postgres"
  DATABASE_USER = "postgres"
  DATABASE_SSL_MODE = "verify-full"
