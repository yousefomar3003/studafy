# Security headers for every response the web app serves (QA-052). Included in the server block AND
# in every location that sets its own add_header: nginx inherits add_header into a location only
# when that location defines none, so a location adding Cache-Control would otherwise drop all of
# these (and every SPA route is served through /index.html).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Report-Only first (QA-052 AC2): watch the browser console and Sentry for a week, then switch the
# header name to Content-Security-Policy. connect-src covers the API, the realtime gateway, Sentry's
# ingest, Turnstile and presigned uploads/downloads (R2); img-src the same storage and data/blob
# previews. frame-ancestors 'none' is the clickjacking protection.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; font-src 'self' data:; connect-src 'self' https://api.studafy.com wss://api.studafy.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://challenges.cloudflare.com https://*.r2.cloudflarestorage.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
