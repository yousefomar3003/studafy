# Replaces /etc/nginx/conf.d/default.conf. Listens on 8080 (not 80) so the master process never
# needs CAP_NET_BIND_SERVICE / root to bind its port — the whole point of running nginx as the
# non-root "app" user set up in infra/docker/web.Dockerfile.
# www.studafy.com is an alias: send it to the one public address so links, bookmarks and search
# results all land on https://studafy.com. Fly terminates TLS and passes the Host header through.
server {
    listen 8080;
    server_name www.studafy.com;
    return 301 https://studafy.com$request_uri;
}

# school.studafy.com was the old school sign-in portal; its paths mean nothing here, so every visit
# goes to the sign-in page of the app that replaced it.
server {
    listen 8080;
    server_name school.studafy.com;
    return 301 https://app.studafy.com/auth/login;
}

# legal.studafy.com hosted the legal documents before they moved into this site; app store
# listings, emails and printed material still link there. Each document keeps its address, with
# /ar/<document> opening the Arabic text; anything else goes to the privacy policy.
server {
    listen 8080;
    server_name legal.studafy.com;
    location = /privacy { return 301 https://studafy.com/privacy; }
    location = /terms { return 301 https://studafy.com/terms; }
    location = /school-agreement { return 301 https://studafy.com/school-agreement; }
    location ~ ^/ar/(privacy|terms|school-agreement)/?$ { return 301 https://studafy.com/$1?lang=ar; }
    location ~ ^/(ar/)?delete-account/?$ { return 301 https://studafy.com/legal/delete-account; }
    location / { return 301 https://studafy.com/privacy; }
}

server {
    # Every other host (studafy.com, app.studafy.com, and Fly's internal health checks).
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's compiled-in default (/var/cache/nginx/client_temp) isn't writable by a non-root
    # process; this app never triggers request-body buffering to disk in normal use (static GET
    # traffic), but a writable path still needs to exist for the rare case nginx decides to use it.
    client_body_temp_path /tmp/client_temp;

    # apps/web is a client-side-routed SPA (react-router-dom): any path nginx can't match to a
    # real file falls back to index.html so the router — not nginx — decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is visible immediately; Vite's
    # hashed filenames under /assets/ are content-addressed, so those are safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
}
