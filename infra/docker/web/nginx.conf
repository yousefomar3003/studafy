# Replaces /etc/nginx/conf.d/default.conf. Listens on 8080 (not 80) so the master process never
# needs CAP_NET_BIND_SERVICE / root to bind its port — the whole point of running nginx as the
# non-root "app" user set up in infra/docker/web.Dockerfile.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's compiled-in default (/var/cache/nginx/client_temp) isn't writable by a non-root
    # process; this app never triggers request-body buffering to disk in normal use (static GET
    # traffic), but a writable path still needs to exist for the rare case nginx decides to use it.
    client_body_temp_path /tmp/client_temp;

    # apps/web is a client-side-routed SPA (react-router-dom): any path nginx can't match to a
    # real file falls back to index.html so the router — not nginx — decides what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is visible immediately; Vite's
    # hashed filenames under /assets/ are content-addressed, so those are safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
}
