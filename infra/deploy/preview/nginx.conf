# Preview-only nginx config. Fronts the co-located `api` container in the same ECS task and serves
# apps/web's static bundle from one origin, so the SPA can call a same-origin `/api` (the preview
# web bundle is built with VITE_API_BASE_URL=/api) and no CORS configuration is needed on the API.
#
# Based on infra/docker/web/nginx.conf — same non-root :8080 listener, same SPA fallback, same
# cache classes — with two preview-specific additions: the /api/ reverse proxy, and an
# X-Robots-Tag so an ephemeral preview URL never lands in a search index.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_body_temp_path /tmp/client_temp;

    # api runs in the same task; awsvpc mode shares one network namespace, so it is reachable on
    # loopback and needs no ENI ingress rule of its own. The trailing slash on both sides strips
    # the /api prefix: /api/healthz -> http://127.0.0.1:3000/healthz.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # apps/realtime is not deployed to previews, but keep the upgrade headers correct in case a
        # future preview adds a websocket route behind the same proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's own liveness endpoint — the web container's ECS health check hits this. Distinct
    # from /api/healthz, which proxies through to the api container's own probe.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
}
