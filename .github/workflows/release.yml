name: Signed container release

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        required: true
      tag:
        description: Immutable release tag, normally the Git commit SHA
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, realtime, workers, web, erpnext, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Read environment outputs
        run: terraform init -reconfigure -backend-config=environments/${{ inputs.environment }}/backend.hcl
        working-directory: infra/terraform
      - name: Build, push, and attest
        shell: bash
        env:
          # Only consumed by web.Dockerfile's dedicated `--mount=type=secret` RUN step (ST-213);
          # every other service's Dockerfile has no such mount, so the secret is simply unused for
          # them. Environment-scoped, same as the AWS role ARNs above -- unset until a Sentry
          # project is actually wired up for ${{ inputs.environment }}, in which case
          # sentryReleaseUploadEnabled (vite.config.ts) stays false and the build behaves exactly
          # like the unauthenticated containers.yml validation build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          repo=$(terraform -chdir=infra/terraform output -json registry_repository_urls | jq -r '.${{ matrix.service }}')
          image="$repo:${{ inputs.tag }}"

          # web's release build correlates every captured Sentry error to this same image tag and
          # uploads its source maps (see apps/web/src/lib/monitoring and infra/docker/web.Dockerfile);
          # no other service needs these build args.
          extra_build_args=()
          if [ "${{ matrix.service }}" = "web" ]; then
            extra_build_args=(
              --build-arg "VITE_RELEASE_VERSION=${{ inputs.tag }}"
              --build-arg "VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}"
              --build-arg "SENTRY_ORG=${{ vars.SENTRY_ORG }}"
              --build-arg "SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}"
              --secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN"
            )
          fi

          docker buildx build \
            --file "infra/docker/${{ matrix.service }}.Dockerfile" \
            --tag "$image" \
            --sbom=true \
            --provenance=mode=max \
            "${extra_build_args[@]}" \
            --push .
          digest=$(aws ecr describe-images \
            --repository-name "studafy-${{ inputs.environment }}/${{ matrix.service }}" \
            --image-ids imageTag=${{ inputs.tag }} \
            --query 'imageDetails[0].imageDigest' --output text)
          key="awskms:///$(terraform -chdir=infra/terraform output -raw registry_signing_key_alias)"
          cosign sign --yes --key "$key" "$repo@$digest"
