name: Signed container release

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        required: true
      tag:
        description: Immutable release tag, normally the Git commit SHA
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, realtime, workers, web, erpnext, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Read environment outputs
        run: terraform init -reconfigure -backend-config=environments/${{ inputs.environment }}/backend.hcl
        working-directory: infra/terraform
      - name: Build, push, and attest
        shell: bash
        run: |
          repo=$(terraform -chdir=infra/terraform output -json registry_repository_urls | jq -r '.${{ matrix.service }}')
          image="$repo:${{ inputs.tag }}"
          docker buildx build \
            --file "infra/docker/${{ matrix.service }}.Dockerfile" \
            --tag "$image" \
            --sbom=true \
            --provenance=mode=max \
            --push .
          digest=$(aws ecr describe-images \
            --repository-name "studafy-${{ inputs.environment }}/${{ matrix.service }}" \
            --image-ids imageTag=${{ inputs.tag }} \
            --query 'imageDetails[0].imageDigest' --output text)
          key="awskms:///$(terraform -chdir=infra/terraform output -raw registry_signing_key_alias)"
          cosign sign --yes --key "$key" "$repo@$digest"
