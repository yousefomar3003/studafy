name: Signed container release

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]
        required: true
      tag:
        description: Immutable release tag, normally the Git commit SHA
        required: true
  # Lets build-and-sign.yml call this same job on every main merge instead of duplicating the
  # build/SBOM/provenance/sign matrix below. workflow_call inputs can't use type: choice, so the
  # caller is trusted to pass a valid environment.
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api,
            realtime,
            workers,
            web,
            erpnext,
            migrations,
            prometheus,
            grafana,
            alertmanager,
            otel-collector,
            tempo,
            loki,
            vector,
            clamav,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - name: Read environment outputs
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform init -reconfigure -backend-config="environments/${DEPLOY_ENVIRONMENT}/backend.hcl"
        working-directory: infra/terraform
      - name: Build, push, and attest
        shell: bash
        env:
          # Only consumed by web.Dockerfile's dedicated `--mount=type=secret` RUN step (ST-213);
          # every other service's Dockerfile has no such mount, so the secret is simply unused for
          # them. Environment-scoped, same as the AWS role ARNs above -- unset until a Sentry
          # project is actually wired up for ${{ inputs.environment }}, in which case
          # sentryReleaseUploadEnabled (vite.config.ts) stays false and the build behaves exactly
          # like the unauthenticated containers.yml validation build.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Every workflow value the script below uses arrives as an environment variable and is
          # only ever expanded inside double quotes -- never interpolated into the script text with
          # ${{ }}, where a crafted value (an input, or an Environment variable anyone with settings
          # access can edit) would be executed as shell (Semgrep run-shell-injection).
          SERVICE: ${{ matrix.service }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # Per-tier public endpoints and the Turnstile site key, baked into the static bundle.
          # GitHub Environment variables, not secrets: all three end up in browser-visible JS. Left
          # unset, the bundle would call http://localhost:3000 and show Cloudflare's always-pass test
          # widget -- see infra/docker/web.Dockerfile and docs/runbooks/production-secrets.md.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_REALTIME_BASE_URL: ${{ vars.VITE_REALTIME_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          repo=$(terraform -chdir=infra/terraform output -json registry_repository_urls | jq -r --arg s "$SERVICE" '.[$s]')
          image="$repo:$RELEASE_TAG"

          # web's release build correlates every captured Sentry error to this same image tag and
          # uploads its source maps (see apps/web/src/lib/monitoring and infra/docker/web.Dockerfile);
          # no other service needs these build args.
          extra_build_args=()
          if [ "$SERVICE" = "web" ]; then
            extra_build_args=(
              --build-arg "VITE_RELEASE_VERSION=$RELEASE_TAG"
              --build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN"
              --build-arg "SENTRY_ORG=$SENTRY_ORG"
              --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT"
              --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL"
              --build-arg "VITE_REALTIME_BASE_URL=$VITE_REALTIME_BASE_URL"
              --build-arg "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY"
              --secret "id=sentry_auth_token,env=SENTRY_AUTH_TOKEN"
            )
          fi

          docker buildx build \
            --file "infra/docker/$SERVICE.Dockerfile" \
            --tag "$image" \
            --sbom=true \
            --provenance=mode=max \
            "${extra_build_args[@]}" \
            --push .
          digest=$(aws ecr describe-images \
            --repository-name "studafy-$DEPLOY_ENVIRONMENT/$SERVICE" \
            --image-ids "imageTag=$RELEASE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          key="awskms:///$(terraform -chdir=infra/terraform output -raw registry_signing_key_alias)"
          cosign sign --yes --key "$key" "$repo@$digest"
