name: Secrets rotation schedule

# Calendar automation for the quarterly secret rotation drill
# (docs/runbooks/security/rotation-schedule.md). Opens one "secrets-rotation" issue that is the
# quarter's checklist and evidence record, on 1 Jan/Apr/Jul/Oct at 06:00 UTC (09:00 Asia/Amman —
# Jordan is UTC+3 year-round, the on-call working-week timezone). workflow_dispatch exists so a
# missed or manually-rerun quarter can be opened on demand; the concurrency guard prevents the two
# from ever racing to a duplicate issue.
#
# This uses only the `gh` binary already present on GitHub-hosted runners — no action versioning to
# pin, which also keeps the semgrep mutable-action-tag rule moot here.

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: secrets-rotation-schedule
  cancel-in-progress: false

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Open the quarter's rotation issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create secrets-rotation \
            --repo "$GITHUB_REPOSITORY" \
            --color D4C5F9 \
            --description "Quarterly secret rotation drill" \
            --force

          # A quarter may already be open (manual re-dispatch, or a skipped quarter that stayed
          # open by design — see rotation-drill.md's closing rule): never stack a duplicate.
          if gh issue list --repo "$GITHUB_REPOSITORY" --label secrets-rotation --state open \
            --json number --jq 'length' | grep -q '^[1-9]'; then
            echo "an open secrets-rotation issue already exists; not creating a duplicate" >&2
            exit 0
          fi

          MONTH=$(date +%-m)
          YEAR=$(date +%Y)
          QUARTER=$(( (10#$MONTH - 1) / 3 + 1 ))

          # The human contract, not a rendered replica of the docs: the issue points at the
          # runbooks and the drill procedure, which are the authority for the actual steps.
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Secrets rotation drill — Q${QUARTER} ${YEAR}" \
            --label "secrets-rotation" \
            --body "$(cat <<EOF
          Quarterly secret rotation drill. Run it in the first full working week of the quarter
          (Sunday–Thursday, Asia/Amman), following docs/runbooks/security/rotation-drill.md.

          ## Checklist
          - [ ] Pre-flight (staging healthy, no deploy in flight, apply exports ready)
          - [ ] JWT signing keys — verify (\`rotation-jwt-jwks.md\`)
          - [ ] DB credentials — on-demand rotation + zero-downtime gate (\`rotation-db.md\`)
          - [ ] Provider API keys — rotate one live key (\`rotation-provider-api-keys.md\`)
          - [ ] Webhook secrets — rotate one sender-backed webhook (\`rotation-webhook-secrets.md\`)
          - [ ] Audit evidence recorded (CloudTrail + log queries, \`rotation-schedule.md\`)
          - [ ] Reviewer sign-off posted; close this issue

          Schedule: \`rotation-schedule.md\` — cadence, ownership, and the shared evidence procedure.
          Inventory: \`secrets-conventions.md\` (unchanged by rotation).
          EOF
          )"
