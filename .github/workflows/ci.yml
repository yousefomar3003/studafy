name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  cross-tenant-security:
    name: cross-tenant-security
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      # The security suite imports the Hono app, which reaches @studafy/constants and
      # @studafy/shared-schemas through their built dist/ -- and dist/ is gitignored, so it
      # only exists once something builds it. This job invokes `bun test` directly rather than
      # through turbo, so turbo's `test -> ^build` dependency never fires; without this step the
      # app-level tests die at import time. `@studafy/api^...` selects the API's workspace
      # dependencies without rebuilding the API itself, and stays correct if it gains another.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Run NFR-05 cross-tenant security probe
        run: bun run test:security
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker compose -f db/compose.yml down

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
      # db/compose.yml already starts Redis for this job; without the URL exported, every
      # Redis-gated suite silently skips. ST-116's cache-invalidation SLA test is one of them.
      REDIS_URL: redis://127.0.0.1:6390
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL + Redis
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Run API integration tests
        run: bun run test:integration
        working-directory: apps/api
      # Its own step because test:integration globs only tests/harness, and this suite lives beside
      # the module it covers under src/. It holds the ST-116 acceptance probes -- draft/submitted/
      # approved/rejected grades stay invisible, parents reach only linked children, no cross-tenant
      # read -- plus the real-Redis <5s cache-invalidation SLA. All of them are database- or
      # Redis-gated, so they no-op in the quality job and only become real gates here.
      - name: Published grades probes + cache invalidation SLA (ST-116)
        run: bun test src/modules/grades/__tests__/published.test.ts --timeout 60000
        working-directory: apps/api
      # Its own step rather than folded into test:integration, which globs only tests/harness. The
      # session suites need a database (test:integration's does too, but tests/auth also holds the
      # ST-070 probe-app tests, which do not and run in the main unit suite).
      - name: Run session lifecycle tests (ST-071)
        run: bun run test:auth
        working-directory: apps/api
      # Database-backed SES → SNS webhook suite (deliverability R-08): ledger insert, suppression
      # upsert, delivery transition, and at-least-once redelivery against the real unique constraint.
      # Its own step because test:integration globs only tests/harness and this suite lives under
      # tests/email. Self-skips in the quality job, which has no database.
      - name: Email webhook DB integration (deliverability R-08)
        run: bun test tests/email/webhook.db.test.ts --timeout 60000
        working-directory: apps/api
      # Database-backed ERPNext webhook suite: the happy path's dedup + audit + outbox rows in one
      # tenant transaction, the outbox payload's jsonb-object encoding (a double-encoded JSON string
      # here would silently corrupt every relay consumer), and the invoice/fee-schedule cache
      # projections (student + currency resolution, currency-exponent minor units). Its own step for
      # the same reason as the email suite: test:integration globs only tests/harness. Self-skips in
      # the quality job.
      - name: ERPNext webhook DB integration
        run: bun test tests/erpnext/webhook.db.test.ts --timeout 60000
        working-directory: apps/api
      - name: Invitation verification timing benchmark (valid vs miss)
        env:
          INVITATION_VERIFICATION_BENCHMARK: "1"
        run: bun test tests/benchmark/invitation-verification-benchmark.test.ts --timeout 180000
        working-directory: apps/api
      # Asserts the ST-071 acceptance target. An absolute wall clock rather than a delta, unlike the
      # middleware benchmarks in the api-quality job: rotation has no baseline arm to subtract, and
      # its cost is dominated by database round trips rather than framework overhead. Two arms — a
      # serial one on a pinned connection that gates per-rotation cost against the 5 ms target, and a
      # 16-way one that gates throughput rather than latency, because at concurrency == pool size the
      # per-call median is a queue-depth artefact. See the file header.
      - name: Refresh rotation benchmark (<5ms per rotation, 16-way throughput floor)
        env:
          REFRESH_ROTATION_BENCHMARK: "1"
        run: bun test tests/benchmark/refresh-rotation-benchmark.test.ts --timeout 180000
        working-directory: apps/api
      - name: Stop disposable PostgreSQL + Redis
        if: always()
        run: docker compose -f db/compose.yml down

  database-migrations:
    runs-on: ubuntu-latest
    # The database is started from db/compose.yml rather than a `services:` block because it must run
    # `pgvector/pgvector:pg16` (for the `vector` extension) with `pg_stat_statements` preloaded via a
    # container command -- a GitHub `services:` block cannot override the container command. Reusing
    # the compose file keeps the image and preload configuration identical to local development.
    env:
      # Disposable, ephemeral-container-only password (matches db/compose.yml's required variable).
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 16 (pgvector + pg_stat_statements preloaded)
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      - name: Migrate and audit tenant RLS coverage
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
        run: |
          bun run db:migrate
          bun run db:test:rls-coverage
      - run: bun test --max-concurrency=2 --timeout=10000
        working-directory: packages/db
      # The seed integration test creates a disposable database, runs all migrations, seeds 40+
      # tables, and verifies index health — it needs its own timeout budget rather than the
      # 10-second default used by the unit/integration suite above.
      - name: Seed integration test (demo tenant + index health)
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
          SEED_INTEGRATION: "1"
        run: bun test tests/seed.test.ts --timeout 90000
        working-directory: packages/db
      - name: Attendance 40-record benchmark
        env:
          ATTENDANCE_BENCHMARK: "1"
        run: bun test tests/attendance-benchmark.test.ts
        working-directory: packages/db
      - name: Notification send benchmark (device resolution + 10-notification batch)
        env:
          NOTIFICATIONS_BENCHMARK: "1"
        run: bun test tests/notifications-benchmark.test.ts
        working-directory: packages/db
      - name: Audit log append benchmark (100-log batch)
        env:
          AUDIT_LOGS_BENCHMARK: "1"
        run: bun test tests/audit-logs-benchmark.test.ts
        working-directory: packages/db
      # Seeds 100,000 chunks across four tenants, builds the HNSW graph, and measures the RRF hybrid
      # retrieval. Slow by nature -- the index build dominates -- so it gets its own step and a long
      # timeout rather than running inside the main suite.
      - name: Hybrid search benchmark (100k chunks, RRF)
        env:
          MATERIAL_CHUNKS_BENCHMARK: "1"
        run: bun test tests/material-chunks-benchmark.test.ts --timeout 900000
        working-directory: packages/db
      # Exercises the deployable partition maintenance subcommands against a freshly migrated database:
      # 12 months reaches beyond each migration's fixed initial range, and the second run of each proves
      # idempotency. Production scheduling remains an explicit in-VPC infrastructure follow-up.
      - name: Partition maintenance (attendance + audit logs, and idempotency)
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
        run: |
          bun run db:migrate
          bun run db:attendance:partitions 12
          bun run db:attendance:partitions 12
          bun run db:audit:partitions 12
          bun run db:audit:partitions 12
          bun run db:migrate:validate
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f db/compose.yml down

  # ST-211's axe budget (zero critical/serious violations) and its keyboard-only walkthrough of 5
  # core journeys. Its own job, not folded into `quality`, because it needs a Chromium install and a
  # production build+preview server that nothing else in this workflow requires. Runs against
  # `vite build && vite preview` rather than `vite dev` — see `playwright.a11y.config.ts`'s own doc
  # comment for why: React 18 `<StrictMode>` (dev-only) makes the focus-trap/color-contrast checks
  # this job runs unreliable in a way that does not reflect what ships. No Postgres or `apps/api`
  # process needed — every spec under `bun run e2e:a11y` stubs its own backend via `page.route()`.
  web-accessibility:
    name: web-accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Build the workspace packages the web app imports
        run: bunx turbo run build --filter=@studafy/web^...
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Axe CI budget + keyboard-only walkthrough (ST-211)
        run: bun run e2e:a11y
        working-directory: apps/web
      - name: Upload keyboard-walkthrough recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-walkthrough-videos
          path: apps/web/test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14

  # ST-062's acceptance gate: the generated Dart client builds deterministically from
  # apps/api/openapi.json and a Flutter app can reach a live /healthz through it. The rest of
  # apps/mobile stays excluded from `quality` (--filter=!@studafy/mobile) -- this job is scoped to
  # exactly the API client, not a general mobile CI lane.
  mobile-api-client:
    name: mobile-api-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      # Both the OpenAPI generator and the liveness probe this job starts below import the Hono
      # app, which reaches @studafy/constants and @studafy/shared-schemas through their built
      # dist/ -- see the identical step in cross-tenant-security for why.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Regenerate the OpenAPI document
        run: bun run openapi:generate
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Generate the Dart API client (ST-062)
        run: bun run client:generate
        working-directory: apps/mobile
      - name: Fail on generation drift
        run: bun run client:check-drift
        working-directory: apps/mobile
      # No DATABASE_HOST/REDIS_URL: /healthz "never checks a dependency" (apps/api/src/health.ts),
      # and every other env var the API reads has a development-safe default (apps/api/src/env.ts)
      # -- so the liveness probe this job's integration test calls needs neither Postgres nor Redis.
      - name: Start the API for the healthz integration test
        working-directory: apps/api
        run: |
          PORT=38080 HOST=127.0.0.1 NODE_ENV=development nohup bun run src/index.ts \
            > ../../api-server.log 2>&1 &
          echo $! > ../../api-server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:38080/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready within 30s"
          cat ../../api-server.log
          exit 1
      - name: Run the healthz integration test (ST-062)
        env:
          API_BASE_URL: http://127.0.0.1:38080
        run: bun run test:integration
        working-directory: apps/mobile
      - name: Stop the API
        if: always()
        run: kill "$(cat api-server.pid)" 2>/dev/null || true

  # ST-245's coverage gate. Its own job rather than a step in mobile-api-client: that job's
  # `flutter test` scope is a single live-server integration test, unrelated to the full unit +
  # widget suite this one runs for coverage.
  mobile-unit-coverage:
    name: mobile-unit-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      # The generated API client (lib/src/core/api/generated/) is gitignored and most of the app
      # imports it, so `flutter test` can't even compile without regenerating it first -- same
      # setup as mobile-api-client, see its identical steps for why each one is needed.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Regenerate the OpenAPI document
        run: bun run openapi:generate
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Generate the Dart API client (ST-062)
        run: bun run client:generate
        working-directory: apps/mobile
      # continue-on-error, not a hard stop: a failing test still exercises the lines it reaches
      # before failing, and the coverage gate below needs that lcov.info regardless. The "Fail on
      # any failing test" step at the end still turns this job red when tests fail -- this just
      # keeps the coverage report (and its artifact) from being skipped along with it.
      - name: Run unit and widget tests with coverage
        id: test
        continue-on-error: true
        run: bun run test:coverage
        working-directory: apps/mobile
      - name: Coverage gate (ST-245)
        run: bun run coverage:check
        working-directory: apps/mobile
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: |
            apps/mobile/coverage/lcov.info
            apps/mobile/coverage/coverage-report.md
          if-no-files-found: error
      - name: Fail on any failing test
        if: steps.test.outcome == 'failure'
        run: |
          echo '::error::flutter test reported failing tests -- see the "Run unit and widget tests with coverage" step above.'
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - run: bun run format:check
      - run: bunx turbo run lint check-types test build --filter=!@studafy/mobile
      - name: Regenerate the permission matrix and fail on drift
        run: |
          bun run --cwd packages/constants docs:generate
          if ! git diff --quiet -- packages/constants/docs/permission-matrix.md; then
            {
              echo '## Permission matrix drift'
              echo
              echo 'packages/constants/docs/permission-matrix.md does not match packages/constants/src/permissions.ts.'
              echo 'Run `bun run --cwd packages/constants docs:generate` and commit the result.'
              echo
              echo '```diff'
              git --no-pager diff -- packages/constants/docs/permission-matrix.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # oasdiff needs the base revision of the document to compare against. actions/checkout fetches
      # depth 1, so the base branch is not in the object store; fetch the single commit rather than
      # paying for full history. The file is written inside the workspace, not $RUNNER_TEMP, because
      # the step below is a Docker action and only $GITHUB_WORKSPACE is bind-mounted into it.
      #
      # The exists guard is not hypothetical: the pull request that introduces this workflow has no
      # document on its base branch, and `git show` would take the job down.
      - name: Fetch the base OpenAPI document
        if: github.event_name == 'pull_request'
        id: base_spec
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          mkdir -p .oasdiff
          if git cat-file -e FETCH_HEAD:apps/api/openapi.json 2>/dev/null; then
            git show FETCH_HEAD:apps/api/openapi.json > .oasdiff/base.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No OpenAPI document on the base branch yet; skipping the breaking-change check.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Classifies contract changes against the base branch and fails on a breaking one.
      #
      # review: false and github-token: "" are load-bearing, not cosmetic. The action defaults to
      # review: true, which uploads both documents to oasdiff.com, and defaults github-token to
      # github.token so it tries to post a pull-request comment -- which would need
      # `permissions: pull-requests: write`, a privilege no workflow here grants. Turning both off
      # keeps every document inside CI and keeps the token read-only; a breaking change surfaces as
      # a red job and a step summary instead.
      - name: Detect breaking API changes
        if: github.event_name == 'pull_request' && steps.base_spec.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.6
        with:
          base: .oasdiff/base.json
          revision: apps/api/openapi.json
          fail-on: ERR
          review: false
          github-token: ""
      # Asserts the ST-060 acceptance target. Unlike the two benchmarks below, this one is an
      # absolute wall clock: there is no baseline arm to subtract, because generating the document is
      # the whole program. Median of five spawns, several times the budget in headroom -- see the
      # file header. Needs no database.
      - name: OpenAPI generation benchmark (<2s)
        env:
          OPENAPI_BENCHMARK: "1"
        run: bun test tests/benchmark/openapi-generate-benchmark.test.ts
        working-directory: apps/api
      # Asserts the ST-061 acceptance target: codegen synthesizes types for every route, tsc verifies
      # them, and the distribution bundle is exported -- all in under 3s. Another absolute wall clock
      # for the same reason as the OpenAPI one: producing the typed distribution is the whole program.
      # Median of five single-process spawns; see the test file header for why the type step is scoped
      # to the standard library rather than a full-package tsc. Needs no database.
      - name: API client build benchmark (<3s)
        env:
          CLIENT_BUILD_BENCHMARK: "1"
        run: bun test tests/benchmark/client-build-benchmark.test.ts
        working-directory: packages/api-client
      # Asserts the ST-054 acceptance target. Measures the request-context middleware as a delta
      # against an identical app without it, so shared-runner noise cancels rather than accumulating
      # into the budget -- unlike an absolute wall-clock budget, which is why this one does not need
      # the periodic widening the NFR-05 probe budget required. Needs no database.
      - name: Request-context middleware benchmark (<1ms over baseline)
        env:
          REQUEST_CONTEXT_BENCHMARK: "1"
        run: bun test tests/benchmark/request-context-benchmark.test.ts
        working-directory: apps/api
      # Asserts the ST-055 acceptance target, as the same kind of delta and for the same reasons: the
      # baseline arm is an identical app falling through to Hono's built-in text/plain 404, so what is
      # measured is the problem+json envelope alone. Needs no database.
      - name: Unmatched-route problem+json benchmark (<1ms over baseline)
        env:
          NOT_FOUND_BENCHMARK: "1"
        run: bun test tests/benchmark/not-found-benchmark.test.ts
        working-directory: apps/api
      - run: bun run --cwd packages/ui build-storybook
      - name: Verify Turbo cache replay
        run: bunx turbo run build --filter=!@studafy/mobile --summarize

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Conventional commit gate
        run: |
          if printf 'bad message\n' | bunx commitlint; then
            echo 'invalid commit unexpectedly passed' >&2
            exit 1
          fi
          printf 'test: validate conventional commits\n' | bunx commitlint
