name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  cross-tenant-security:
    name: cross-tenant-security
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      # The security suite imports the Hono app, which reaches @studafy/constants and
      # @studafy/shared-schemas through their built dist/ -- and dist/ is gitignored, so it
      # only exists once something builds it. This job invokes `bun test` directly rather than
      # through turbo, so turbo's `test -> ^build` dependency never fires; without this step the
      # app-level tests die at import time. `@studafy/api^...` selects the API's workspace
      # dependencies without rebuilding the API itself, and stays correct if it gains another.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Run NFR-05 cross-tenant security probe
        run: bun run test:security
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker compose -f db/compose.yml down

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
      # db/compose.yml already starts Redis for this job; without the URL exported, every
      # Redis-gated suite silently skips. ST-116's cache-invalidation SLA test is one of them.
      REDIS_URL: redis://127.0.0.1:6390
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL + Redis
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Run API integration tests
        run: bun run test:integration
        working-directory: apps/api
      # Its own step because test:integration globs only tests/harness, and this suite lives beside
      # the module it covers under src/. It holds the ST-116 acceptance probes -- draft/submitted/
      # approved/rejected grades stay invisible, parents reach only linked children, no cross-tenant
      # read -- plus the real-Redis <5s cache-invalidation SLA. All of them are database- or
      # Redis-gated, so they no-op in the quality job and only become real gates here.
      - name: Published grades probes + cache invalidation SLA (ST-116)
        run: bun test src/modules/grades/__tests__/published.test.ts --timeout 60000
        working-directory: apps/api
      # Its own step rather than folded into test:integration, which globs only tests/harness. The
      # session suites need a database (test:integration's does too, but tests/auth also holds the
      # ST-070 probe-app tests, which do not and run in the main unit suite).
      - name: Run session lifecycle tests (ST-071)
        run: bun run test:auth
        working-directory: apps/api
      # Database-backed SES → SNS webhook suite (deliverability R-08): ledger insert, suppression
      # upsert, delivery transition, and at-least-once redelivery against the real unique constraint.
      # Its own step because test:integration globs only tests/harness and this suite lives under
      # tests/email. Self-skips in the quality job, which has no database.
      - name: Email webhook DB integration (deliverability R-08)
        run: bun test tests/email/webhook.db.test.ts --timeout 60000
        working-directory: apps/api
      # Database-backed ERPNext webhook suite: the happy path's dedup + audit + outbox rows in one
      # tenant transaction, the outbox payload's jsonb-object encoding (a double-encoded JSON string
      # here would silently corrupt every relay consumer), and the invoice/fee-schedule cache
      # projections (student + currency resolution, currency-exponent minor units). Its own step for
      # the same reason as the email suite: test:integration globs only tests/harness. Self-skips in
      # the quality job.
      - name: ERPNext webhook DB integration
        run: bun test tests/erpnext/webhook.db.test.ts --timeout 60000
        working-directory: apps/api
      - name: Invitation verification timing benchmark (valid vs miss)
        env:
          INVITATION_VERIFICATION_BENCHMARK: "1"
        run: bun test tests/benchmark/invitation-verification-benchmark.test.ts --timeout 180000
        working-directory: apps/api
      # Asserts the ST-071 acceptance target. An absolute wall clock rather than a delta, unlike the
      # middleware benchmarks in the api-quality job: rotation has no baseline arm to subtract, and
      # its cost is dominated by database round trips rather than framework overhead. Two arms — a
      # serial one on a pinned connection that gates per-rotation cost against the 5 ms target, and a
      # 16-way one that gates throughput rather than latency, because at concurrency == pool size the
      # per-call median is a queue-depth artefact. See the file header.
      - name: Refresh rotation benchmark (<5ms per rotation, 16-way throughput floor)
        env:
          REFRESH_ROTATION_BENCHMARK: "1"
        run: bun test tests/benchmark/refresh-rotation-benchmark.test.ts --timeout 180000
        working-directory: apps/api
      - name: Stop disposable PostgreSQL + Redis
        if: always()
        run: docker compose -f db/compose.yml down

  database-migrations:
    runs-on: ubuntu-latest
    # The database is started from db/compose.yml rather than a `services:` block because it must run
    # `pgvector/pgvector:pg16` (for the `vector` extension) with `pg_stat_statements` preloaded via a
    # container command -- a GitHub `services:` block cannot override the container command. Reusing
    # the compose file keeps the image and preload configuration identical to local development.
    env:
      # Disposable, ephemeral-container-only password (matches db/compose.yml's required variable).
      POSTGRES_PASSWORD: studafy_ci_only
      TEST_DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 16 (pgvector + pg_stat_statements preloaded)
        run: docker compose -f db/compose.yml up -d --wait
      - uses: ./.github/actions/setup-bun-workspace
      - name: Migrate and audit tenant RLS coverage
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
        run: |
          bun run db:migrate
          bun run db:test:rls-coverage
      - run: bun test --max-concurrency=2 --timeout=10000
        working-directory: packages/db
      # The seed integration test creates a disposable database, runs all migrations, seeds 40+
      # tables, and verifies index health — it needs its own timeout budget rather than the
      # 10-second default used by the unit/integration suite above.
      - name: Seed integration test (demo tenant + index health)
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
          SEED_INTEGRATION: "1"
        run: bun test tests/seed.test.ts --timeout 90000
        working-directory: packages/db
      - name: Attendance 40-record benchmark
        env:
          ATTENDANCE_BENCHMARK: "1"
        run: bun test tests/attendance-benchmark.test.ts
        working-directory: packages/db
      - name: Notification send benchmark (device resolution + 10-notification batch)
        env:
          NOTIFICATIONS_BENCHMARK: "1"
        run: bun test tests/notifications-benchmark.test.ts
        working-directory: packages/db
      - name: Audit log append benchmark (100-log batch)
        env:
          AUDIT_LOGS_BENCHMARK: "1"
        run: bun test tests/audit-logs-benchmark.test.ts
        working-directory: packages/db
      # Seeds 100,000 chunks across four tenants, builds the HNSW graph, and measures the RRF hybrid
      # retrieval. Slow by nature -- the index build dominates -- so it gets its own step and a long
      # timeout rather than running inside the main suite.
      - name: Hybrid search benchmark (100k chunks, RRF)
        env:
          MATERIAL_CHUNKS_BENCHMARK: "1"
        run: bun test tests/material-chunks-benchmark.test.ts --timeout 900000
        working-directory: packages/db
      # Exercises the deployable partition maintenance subcommands against a freshly migrated database:
      # 12 months reaches beyond each migration's fixed initial range, and the second run of each proves
      # idempotency. Production scheduling remains an explicit in-VPC infrastructure follow-up.
      - name: Partition maintenance (attendance + audit logs, and idempotency)
        env:
          DATABASE_URL: postgresql://studafy_test:studafy_ci_only@127.0.0.1:54329/postgres?sslmode=disable
          DATABASE_SSL_MODE: disable
        run: |
          bun run db:migrate
          bun run db:attendance:partitions 12
          bun run db:attendance:partitions 12
          bun run db:audit:partitions 12
          bun run db:audit:partitions 12
          bun run db:migrate:validate
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f db/compose.yml down

  # ST-211's axe budget (zero critical/serious violations) and its keyboard-only walkthrough of 5
  # core journeys. Its own job, not folded into `quality`, because it needs a Chromium install and a
  # production build+preview server that nothing else in this workflow requires. Runs against
  # `vite build && vite preview` rather than `vite dev` — see `playwright.a11y.config.ts`'s own doc
  # comment for why: React 18 `<StrictMode>` (dev-only) makes the focus-trap/color-contrast checks
  # this job runs unreliable in a way that does not reflect what ships. No Postgres or `apps/api`
  # process needed — every spec under `bun run e2e:a11y` stubs its own backend via `page.route()`.
  web-accessibility:
    name: web-accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Build the workspace packages the web app imports
        run: bunx turbo run build --filter=@studafy/web^...
      # No --with-deps: it runs `apt-get update`, and Playwright's own install-deps logic adds
      # (or re-adds, if something upstream already removed it) an apt source for
      # dl.google.com/linux/chrome-stable regardless of anything this workflow does beforehand --
      # confirmed by two separate runs, an hour apart, both hitting the exact same stale package
      # index with an identical "Last modification" timestamp: this is a broken upstream CDN edge
      # on Google's own infrastructure, not a rotating mirror a retry or a pre-emptive `rm` of the
      # source file can route around. --with-deps was never actually needed here: GitHub's
      # ubuntu-latest runner image ships Chromium's own OS-level shared-library dependencies
      # pre-installed (its documented software list includes Chromium/Chrome/Edge), so a plain
      # `playwright install chromium` only downloads Playwright's own bundled binary -- no apt
      # involved, nothing to fail on dl.google.com's account.
      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            echo "--- Install attempt $attempt/3 ---"
            if bunx playwright install chromium; then
              exit 0
            fi
            echo "Install failed, retrying in 15s..."
            sleep 15
          done
          echo "Install failed after 3 attempts" >&2
          exit 1
        working-directory: apps/web
      - name: Axe CI budget + keyboard-only walkthrough (ST-211)
        run: bun run e2e:a11y
        working-directory: apps/web
      - name: Upload keyboard-walkthrough recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-walkthrough-videos
          path: apps/web/test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 14

  # ST-062's acceptance gate: the generated Dart client builds deterministically from
  # apps/api/openapi.json and a Flutter app can reach a live /healthz through it. The rest of
  # apps/mobile stays excluded from `quality` (--filter=!@studafy/mobile) -- this job is scoped to
  # exactly the API client, not a general mobile CI lane.
  mobile-api-client:
    name: mobile-api-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      # Both the OpenAPI generator and the liveness probe this job starts below import the Hono
      # app, which reaches @studafy/constants and @studafy/shared-schemas through their built
      # dist/ -- see the identical step in cross-tenant-security for why.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Regenerate the OpenAPI document
        run: bun run openapi:generate
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Generate the Dart API client (ST-062)
        run: bun run client:generate
        working-directory: apps/mobile
      - name: Fail on generation drift
        run: bun run client:check-drift
        working-directory: apps/mobile
      # No DATABASE_HOST/REDIS_URL: /healthz "never checks a dependency" (apps/api/src/health.ts),
      # and every other env var the API reads has a development-safe default (apps/api/src/env.ts)
      # -- so the liveness probe this job's integration test calls needs neither Postgres nor Redis.
      - name: Start the API for the healthz integration test
        working-directory: apps/api
        run: |
          PORT=38080 HOST=127.0.0.1 NODE_ENV=development nohup bun run src/index.ts \
            > ../../api-server.log 2>&1 &
          echo $! > ../../api-server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:38080/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become ready within 30s"
          cat ../../api-server.log
          exit 1
      - name: Run the healthz integration test (ST-062)
        env:
          API_BASE_URL: http://127.0.0.1:38080
        run: bun run test:integration
        working-directory: apps/mobile
      - name: Stop the API
        if: always()
        run: kill "$(cat api-server.pid)" 2>/dev/null || true

  # ST-245's coverage gate. Its own job rather than a step in mobile-api-client: that job's
  # `flutter test` scope is a single live-server integration test, unrelated to the full unit +
  # widget suite this one runs for coverage.
  mobile-unit-coverage:
    name: mobile-unit-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      # The generated API client (lib/src/core/api/generated/) is gitignored and most of the app
      # imports it, so `flutter test` can't even compile without regenerating it first -- same
      # setup as mobile-api-client, see its identical steps for why each one is needed.
      - name: Build the workspace packages the API imports
        run: bunx turbo run build --filter=@studafy/api^...
      - name: Regenerate the OpenAPI document
        run: bun run openapi:generate
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Generate the Dart API client (ST-062)
        run: bun run client:generate
        working-directory: apps/mobile
      # apps/mobile's own "lint"/"check-types" scripts are no-ops in the turbo pipeline (see their
      # package.json) because the generated client above must exist first -- this is that check,
      # run directly rather than through turbo.
      #
      # continue-on-error, not a hard stop, for the same reason the test step below is: analyze
      # and test are independent checks, and an analyze failure shouldn't skip the test run (and
      # then the coverage-upload step below it) and report a confusing second failure on top of
      # the real one.
      #
      # Report-only for now (see "Report analyze findings" below): this job is *new* in the branch
      # that added it, and the branch touches only CI YAML/scripts -- so every finding it reports
      # is a pre-existing issue in apps/mobile, not a regression this change introduced. `dart
      # analyze` has no --baseline-commit equivalent to scope it to the diff the way the sast job
      # scopes Semgrep, so gating on it here would block unrelated PRs on a pre-existing backlog.
      # Tracked for its own cleanup pass; flip this back to a hard gate (exit 1) once that lands.
      - name: flutter analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze
        working-directory: apps/mobile
      # continue-on-error, not a hard stop: a failing test still exercises the lines it reaches
      # before failing, and the coverage gate below needs that lcov.info regardless. "Fail on any
      # failing test" at the end still turns this job red when tests fail -- this just keeps the
      # coverage report (and its artifact) from being skipped along with it.
      - name: Run unit and widget tests with coverage
        id: test
        continue-on-error: true
        run: bun run test:coverage
        working-directory: apps/mobile
      - name: Coverage gate (ST-245)
        run: bun run coverage:check
        working-directory: apps/mobile
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-report
          path: |
            apps/mobile/coverage/lcov.info
            apps/mobile/coverage/coverage-report.md
          if-no-files-found: error
      # Report-only, not a gate -- see the "flutter analyze" step's comment for why (new job,
      # CI-only branch, pre-existing findings, no diff-scoping available). Surfaces the result
      # without redding the job.
      - name: Report analyze findings
        if: steps.analyze.outcome == 'failure'
        run: |
          echo '::warning::flutter analyze reported issues -- see the "flutter analyze" step above. Report-only for now (pre-existing apps/mobile backlog); not gating this job.'
      - name: Fail on any failing test
        if: steps.test.outcome == 'failure'
        run: |
          echo '::error::flutter test reported failing tests -- see the "Run unit and widget tests with coverage" step above.'
          exit 1

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Pinned to match the trivy-action/trivy versions containers.yml and terraform.yml already
      # use -- .trivyignore's header documents this pin as the project's trivy baseline; running
      # an unpinned `@master` here (as this job used to) drifts from that baseline on trivy's own
      # schedule, not the codebase's.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          scanners: secret,vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          # node_modules/build output aren't source; walking them (node_modules alone is ~1100
          # packages here) is why this job first failed with a context-deadline timeout rather
          # than a real finding. .claude/.opencode/.serena/.sisyphus are local agent-tool state,
          # not part of the codebase either.
          skip-dirs: "**/node_modules,.git,**/.turbo,**/dist,**/build,graphify-out,.claude,.opencode,.serena,.sisyphus"
          timeout: 10m0s
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
      # Dependency-review is PR-diff-scoped (it compares the base and head manifests), so it has
      # no meaning on a push -- unlike the trivy scan above, which scans the full tree either way.
      #
      # continue-on-error: the action hard-fails ("Dependency review is not supported on this
      # repository") unless GitHub's Dependency Graph is enabled -- which, on a private repo,
      # requires GitHub Advanced Security. Until that's turned on for this repo it can't run, and
      # that repo-settings gap shouldn't red the whole security-scan job. The trivy step above
      # already gates on HIGH/CRITICAL dependency CVEs across the full tree; this step only adds
      # the "newly introduced in this PR" call-out, so losing it as a hard gate is tolerable.
      # Drop this line once Dependency Graph is enabled (Settings > Security & analysis).
      - name: Review dependency changes for new vulnerabilities/licenses
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by upload-sarif to attach findings to the Security tab and annotate the PR diff
      # (GitHub Advanced Security must also be enabled for a private repo to get PR-line
      # annotations from this -- see docs/testing/ci-pipeline.md).
      security-events: write
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: --baseline-commit below needs the base/pre-push commit present locally.
          fetch-depth: 0
      # Without this, git refuses to run inside a directory it doesn't consider "safe" when the
      # checkout is owned by a different uid than the container runs as -- the semgrep image's
      # default user isn't the runner's, unlike the ubuntu-latest-run jobs elsewhere in this file.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # p/ci is Semgrep's own recommended default ruleset for CI: OWASP Top 10 coverage across
      # this repo's languages (TS/JS, Dart) without the noisier experimental rulesets. `--error`
      # is what turns findings into a non-zero exit; without it `semgrep scan` always exits 0.
      #
      # --baseline-commit scopes the scan to what this PR/push actually changed -- without it,
      # every PR is gated on this repo's entire pre-existing p/ci backlog (unpinned Action tags,
      # a couple of bunfig.toml settings, etc.), not just what it touched. Falls back to scanning
      # everything when resolve-base-sha.sh can't find a usable base (e.g. a branch's first push).
      - name: Run Semgrep SAST
        run: |
          base="$(bash .github/scripts/resolve-base-sha.sh)"
          semgrep scan --config p/ci --sarif --output semgrep.sarif --error ${base:+--baseline-commit="$base"}
        env:
          SEMGREP_SEND_METRICS: "off"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif

  # ST-249: `secret-scan` above is trivy in `fs` mode — it only ever looks at the working tree at
  # HEAD, so a secret committed and later deleted (in the same PR or in history already on `dev`)
  # is invisible to it. gitleaks walks every commit's diff instead, which is what an actual
  # "secrets scan history" pass needs; `.gitleaks.toml` allowlists the six commits already audited
  # as synthetic test fixtures (ST-249's security pass report has the detail).
  secret-scan-history:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not the mutable `v4` tag: this repo's SAST job (ST-251) flags any
      # action reference that isn't (a floating tag can be silently repointed by the action owner).
      # This job's own checkout is a fresh addition, so it's the one instance that actually got
      # caught by the rule -- every other `actions/checkout@v4` in this file predates that job and
      # wasn't part of the diff the check re-scans. 11d5960 is v4.4.0, the newest v4 release as of
      # this writing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Pinned to a commit SHA, not the mutable `v2` tag, for the same reason. ff98106 is v2.3.9,
      # the newest v2 release as of this writing.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: resolve-affected-filter.sh needs the PR
          # base commit (or the pre-push commit) present locally to diff against.
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-workspace
      # Unconditional, not folded into the affected-packages build below: the oasdiff step and the
      # two benchmarks further down all read the real apps/api/openapi.json off disk directly
      # (not through turbo), but that file is otherwise only ever produced as a side effect of
      # turbo building @studafy/api -- which the affected-package filter skips entirely on any PR
      # that doesn't touch apps/api's own source (this workflow file is exactly such a PR). Without
      # this, those steps ENOENT on a clean checkout whenever @studafy/api isn't "affected".
      - name: Generate the OpenAPI document
        run: bun run --cwd apps/api openapi:generate
      # Keyed on the commit so today's run always starts from the closest prior state; content
      # hashing inside turbo (not this cache key) is what actually decides which tasks re-run --
      # this just carries yesterday's task outputs into today's job so unaffected packages replay
      # instead of recomputing.
      - name: Restore Turbo task cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-
      - name: Resolve the affected-package filter
        id: affected
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: echo "filter=$(bash .github/scripts/resolve-affected-filter.sh)" >> "$GITHUB_OUTPUT"
      - run: bun run format:check
      # `--continue=dependencies-successful` surfaces every independent package's failures in one
      # run instead of stopping at the first, so a PR sees all its annotations at once. Piped
      # through annotate-diagnostics.mjs to turn tsc/ESLint output into inline PR annotations --
      # see that script's header for why a GitHub problem matcher can't do this on its own.
      # `set -o pipefail` is what makes turbo's exit code (not the annotator's) fail the step.
      - name: Lint, typecheck, build (affected packages)
        run: |
          set -o pipefail
          bunx turbo run lint check-types build --filter=!@studafy/mobile ${{ steps.affected.outputs.filter }} \
            --log-order=grouped --continue=dependencies-successful \
            | bun .github/scripts/annotate-diagnostics.mjs
      # Its own invocation, not folded into the line above: `-- --coverage` forwards to every
      # underlying script in the command, and lint/check-types/build don't take that flag.
      - name: Unit tests with coverage (affected packages)
        run: |
          bunx turbo run test --filter=!@studafy/mobile ${{ steps.affected.outputs.filter }} \
            --continue=dependencies-successful -- --coverage --coverage-reporter=lcov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: warn
      - name: Regenerate the permission matrix and fail on drift
        run: |
          bun run --cwd packages/constants docs:generate
          if ! git diff --quiet -- packages/constants/docs/permission-matrix.md; then
            {
              echo '## Permission matrix drift'
              echo
              echo 'packages/constants/docs/permission-matrix.md does not match packages/constants/src/permissions.ts.'
              echo 'Run `bun run --cwd packages/constants docs:generate` and commit the result.'
              echo
              echo '```diff'
              git --no-pager diff -- packages/constants/docs/permission-matrix.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # oasdiff needs the base revision of the document to compare against. The job's checkout is
      # now fetch-depth: 0 (the affected-filter step above needs the same history), so the base
      # commit is already in the object store -- no separate fetch needed. The file is written
      # inside the workspace, not $RUNNER_TEMP, because the step below is a Docker action and only
      # $GITHUB_WORKSPACE is bind-mounted into it.
      #
      # The exists guard is not hypothetical: the pull request that introduces this workflow has no
      # document on its base branch, and `git show` would take the job down.
      - name: Fetch the base OpenAPI document
        if: github.event_name == 'pull_request'
        id: base_spec
        run: |
          mkdir -p .oasdiff
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:apps/api/openapi.json" 2>/dev/null; then
            git show "${{ github.event.pull_request.base.sha }}:apps/api/openapi.json" > .oasdiff/base.json
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo 'No OpenAPI document on the base branch yet; skipping the breaking-change check.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Classifies contract changes against the base branch and fails on a breaking one.
      #
      # review: false and github-token: "" are load-bearing, not cosmetic. The action defaults to
      # review: true, which uploads both documents to oasdiff.com, and defaults github-token to
      # github.token so it tries to post a pull-request comment -- which would need
      # `permissions: pull-requests: write`, a privilege no workflow here grants. Turning both off
      # keeps every document inside CI and keeps the token read-only; a breaking change surfaces as
      # a red job and a step summary instead.
      #
      # continue-on-error is conditional on the PR carrying the "version-bump" label (ST-253): a
      # true expression here makes the step's own failure non-fatal to the job while still recording
      # outcome: failure, the same continue-on-error-plus-outcome-check idiom the mobile-unit-coverage
      # job's "flutter analyze" step already uses below. Without the label the expression is false, so
      # a breaking change fails the job exactly as before -- the label only ever widens the gate for
      # the one PR that carries it, never for the branch as a whole.
      - name: Detect breaking API changes
        if: github.event_name == 'pull_request' && steps.base_spec.outputs.exists == 'true'
        id: breaking_check
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'version-bump') }}
        uses: oasdiff/oasdiff-action/breaking@v0.1.6
        with:
          base: .oasdiff/base.json
          revision: apps/api/openapi.json
          fail-on: ERR
          review: false
          github-token: ""
      # Report-only: makes an intentional, label-approved break visible in the job summary instead
      # of a silently green job. See the "Detect breaking API changes" step's comment for why
      # outcome (not conclusion) is the right check here.
      - name: Report label-bypassed breaking API change
        if: steps.breaking_check.outcome == 'failure'
        run: |
          echo '::warning::Breaking OpenAPI change detected but allowed through via the "version-bump" label -- see the "Detect breaking API changes" step above. Bump the API major version and record the break in docs/api/CHANGELOG.md (see docs/api/api-versioning-policy.md).'
      # Any contract change -- breaking or additive -- must ship with a changelog entry (ST-253's
      # acceptance criteria: "additive change passes with changelog note"). Compared as plain files
      # rather than `git diff`, because .oasdiff/base.json and apps/api/openapi.json are two
      # different paths, not two revisions of the same path. CHANGELOG.md is compared against the PR
      # base revision instead, since that file's path is stable across both sides.
      - name: Require a changelog note for API contract changes
        if: github.event_name == 'pull_request' && steps.base_spec.outputs.exists == 'true'
        run: |
          if diff -q .oasdiff/base.json apps/api/openapi.json > /dev/null; then
            echo 'apps/api/openapi.json is unchanged; no changelog note required.'
          elif git diff --quiet "${{ github.event.pull_request.base.sha }}" -- docs/api/CHANGELOG.md; then
            echo '::error::apps/api/openapi.json changed but docs/api/CHANGELOG.md was not. Add an Unreleased entry describing the change (see docs/api/api-versioning-policy.md).'
            exit 1
          else
            echo 'docs/api/CHANGELOG.md was updated alongside the contract change.'
          fi
      # Asserts the ST-060 acceptance target. Unlike the two benchmarks below, this one is an
      # absolute wall clock: there is no baseline arm to subtract, because generating the document is
      # the whole program. Median of five spawns, several times the budget in headroom -- see the
      # file header. Needs no database.
      - name: OpenAPI generation benchmark (<2s)
        env:
          OPENAPI_BENCHMARK: "1"
        run: bun test tests/benchmark/openapi-generate-benchmark.test.ts
        working-directory: apps/api
      # Asserts the ST-061 acceptance target: codegen synthesizes types for every route, tsc verifies
      # them, and the distribution bundle is exported -- all in under 3s. Another absolute wall clock
      # for the same reason as the OpenAPI one: producing the typed distribution is the whole program.
      # Median of five single-process spawns; see the test file header for why the type step is scoped
      # to the standard library rather than a full-package tsc. Needs no database.
      - name: API client build benchmark (<3s)
        env:
          CLIENT_BUILD_BENCHMARK: "1"
        run: bun test tests/benchmark/client-build-benchmark.test.ts
        working-directory: packages/api-client
      # Asserts the ST-054 acceptance target. Measures the request-context middleware as a delta
      # against an identical app without it, so shared-runner noise cancels rather than accumulating
      # into the budget -- unlike an absolute wall-clock budget, which is why this one does not need
      # the periodic widening the NFR-05 probe budget required. Needs no database.
      - name: Request-context middleware benchmark (<1ms over baseline)
        env:
          REQUEST_CONTEXT_BENCHMARK: "1"
        run: bun test tests/benchmark/request-context-benchmark.test.ts
        working-directory: apps/api
      # Asserts the ST-055 acceptance target, as the same kind of delta and for the same reasons: the
      # baseline arm is an identical app falling through to Hono's built-in text/plain 404, so what is
      # measured is the problem+json envelope alone. Needs no database.
      - name: Unmatched-route problem+json benchmark (<1ms over baseline)
        env:
          NOT_FOUND_BENCHMARK: "1"
        run: bun test tests/benchmark/not-found-benchmark.test.ts
        working-directory: apps/api
      - run: bun run --cwd packages/ui build-storybook
      - name: Verify Turbo cache replay
        run: bunx turbo run build --filter=!@studafy/mobile ${{ steps.affected.outputs.filter }} --summarize
      # ST-253 acceptance criterion: "clients regenerate deterministically". Regenerating twice and
      # diffing the byte output is a stronger check than re-running the codegen once and trusting it --
      # it catches the exact failure mode build-api-client.ts's own normalize() step exists to prevent
      # (see packages/api-client/scripts/build-api-client.ts), directly, in the pipeline that ships it,
      # rather than only in that file's own unit test.
      - name: Regenerate the TypeScript API client twice and diff (determinism check)
        run: |
          bun run client:generate
          cp packages/api-client/src/generated-types.ts "$RUNNER_TEMP/generated-types.first.ts"
          bun run client:generate
          if ! diff -q "$RUNNER_TEMP/generated-types.first.ts" packages/api-client/src/generated-types.ts; then
            echo '::error::packages/api-client/src/generated-types.ts differed across two back-to-back generations from the same apps/api/openapi.json -- client codegen is not deterministic.'
            exit 1
          fi
      # Publishes the exact contract and client this PR would ship, so a reviewer or a downstream
      # consumer (e.g. someone building against the TS client before it's merged) can pull them
      # without checking the branch out. Both inputs are gitignored (see .gitignore) precisely so
      # they never cause merge conflicts -- this is their one durable, inspectable home per run.
      - name: Publish OpenAPI contract + TypeScript client artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-contract
          path: |
            apps/api/openapi.json
            packages/api-client/src/generated-types.ts
          if-no-files-found: error
          retention-days: 14
      # ST-269. Unconditional for the same reason the oasdiff/benchmark steps above are: the site's
      # build validates every guide's worked examples (request paths, methods, error codes) against
      # the real apps/api/openapi.json generated at the top of this job, and it must catch drift on
      # any PR that moves the contract -- not only the PRs that happen to also touch apps/docs-api,
      # which is all the affected-package filter above would run this under.
      - name: Build and validate the API reference site
        env:
          DOCS_API_RELEASE_TAG: ${{ github.sha }}
        run: bun run --cwd apps/docs-api build
      - name: Publish the API reference site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-docs-site
          path: apps/docs-api/dist
          if-no-files-found: error
          retention-days: 14

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Conventional commit gate
        run: |
          if printf 'bad message\n' | bunx commitlint; then
            echo 'invalid commit unexpectedly passed' >&2
            exit 1
          fi
          printf 'test: validate conventional commits\n' | bunx commitlint
