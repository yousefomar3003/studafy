name: Terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [dev]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [infra/terraform/bootstrap, infra/terraform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.directory }}
      - run: terraform init -backend=false
        working-directory: ${{ matrix.directory }}
      - uses: terraform-linters/setup-tflint@v4
      # Child modules intentionally omit their own required_version/required_providers pins and a
      # few interface variables aren't consumed yet — real style warnings, but not build-breaking:
      # the root module (versions.tf) already pins Terraform and every provider version. Only fail
      # the job on actual errors, not warnings/notices.
      - run: tflint --init && tflint --recursive --minimum-failure-severity=error
        working-directory: ${{ matrix.directory }}
      - run: terraform validate
        working-directory: ${{ matrix.directory }}
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          version: v0.72.0
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

  plan:
    if: vars.AWS_TERRAFORM_PLANS_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform init -reconfigure -backend-config=environments/${{ matrix.environment }}/backend.hcl
        working-directory: infra/terraform
      - run: terraform plan -lock=false -input=false -var-file=environments/${{ matrix.environment }}/${{ matrix.environment }}.tfvars
        working-directory: infra/terraform
