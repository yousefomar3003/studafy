name: Containers

on:
  pull_request:
    paths:
      [
        "apps/**",
        "packages/**",
        "db/**",
        "infra/docker/**",
        "bun.lock",
        ".github/workflows/containers.yml",
      ]
  push:
    branches: [dev]
    paths:
      [
        "apps/**",
        "packages/**",
        "db/**",
        "infra/docker/**",
        "bun.lock",
        ".github/workflows/containers.yml",
      ]

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/api.Dockerfile
            max_mb: 150
          - service: realtime
            dockerfile: infra/docker/realtime.Dockerfile
            max_mb: 200
          - service: workers
            dockerfile: infra/docker/workers.Dockerfile
            max_mb: 250
          - service: migrations
            dockerfile: infra/docker/migrations.Dockerfile
            max_mb: 100
          - service: web
            dockerfile: infra/docker/web.Dockerfile
            max_mb: 120
          - service: erpnext
            dockerfile: infra/docker/erpnext.Dockerfile
            max_mb: 2500
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: studafy/${{ matrix.service }}:ci
      - uses: anchore/sbom-action@v0
        with:
          image: studafy/${{ matrix.service }}:ci
          artifact-name: ${{ matrix.service }}.spdx.json
          format: spdx-json
      - name: Enforce image size budget
        run: |
          bytes=$(docker image inspect studafy/${{ matrix.service }}:ci --format '{{.Size}}')
          max=$(( ${{ matrix.max_mb }} * 1024 * 1024 ))
          test "$bytes" -le "$max"
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: studafy/${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
