name: Production deploy (fly.io)

# Releases the selected ref to production on fly.io (infra/fly/README.md). Manual only, and bound to
# the `prod` GitHub Environment, so any required reviewers configured on that environment gate it.
#
# The `prod` environment is the single source of truth for production secrets: every run copies them
# onto the fly apps (staged, so they take effect with the deploy that follows) before anything is
# released. Change a secret in GitHub, rerun this workflow, and every service picks it up.
#
# Order matters and matches the README: the scanner first (the workers reach it), then migrations
# (a release never runs against an older schema), then api, realtime, workers and web.
#
# QA-005: a `gate` job (no secrets, no environment) refuses any ref but dev and any commit whose CI
# run did not pass. App images are built once, Trivy-scanned at HIGH, and deployed by digest, so the
# scanned image is the released one. The smoke check needs /readyz, the auth surface and one shared
# JWT key; if it (or any deploy step) fails, the services go back to the digests they ran before.
# Migrations are forward-only and are not rolled back. The `prod` environment's deployment-branch
# policy (dev only) and required reviewers are the server-side half of the gate: a modified copy of
# this file on another branch cannot pass them (docs/runbooks/deploy.md).
#
# Replaced the retired AWS ECS deploy workflows, removed with the rest of the AWS stack.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release only dev, and only a commit CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/deploy/verify-ci-green.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" ci.yml dev

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Copy secrets from the prod environment to the fly apps
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Optional: traces go to Axiom (EU edge) when both are set; see infra/fly/README.md.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          RECORDS_ENCRYPTION_KEYS: ${{ secrets.RECORDS_ENCRYPTION_KEYS }}
          RECORDS_ENCRYPTION_CURRENT_KEY_ID: ${{ secrets.RECORDS_ENCRYPTION_CURRENT_KEY_ID }}
          WS_JWT_SECRET: ${{ secrets.WS_JWT_SECRET }}
          # QA-023: the API's access-token signing key; the NEXT key only during a rotation window.
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_NEXT_PRIVATE_KEY_PEM: ${{ secrets.JWT_NEXT_PRIVATE_KEY_PEM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          AI_LLM_API_KEY: ${{ secrets.AI_LLM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_RTDN_TOKEN: ${{ secrets.GOOGLE_PLAY_RTDN_TOKEN }}
          # Optional: each feature stays off (and its routes answer 503) until its keys are set.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          # What a service refuses to boot without in production (apps/*/src/env.ts), checked up
          # front so a gap fails here, by name, rather than as a crash-looping machine.
          missing=()
          for key in DATABASE_USER DATABASE_PASSWORD DATABASE_CA_CERT REDIS_URL \
            S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY \
            RECORDS_ENCRYPTION_KEYS RECORDS_ENCRYPTION_CURRENT_KEY_ID WS_JWT_SECRET JWT_PRIVATE_KEY_PEM \
            TURNSTILE_SECRET_KEY AI_LLM_API_KEY RESEND_API_KEY RESEND_WEBHOOK_SECRET \
            FIREBASE_SERVICE_ACCOUNT GOOGLE_PLAY_SERVICE_ACCOUNT GOOGLE_PLAY_RTDN_TOKEN; do
            [ -n "${!key:-}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing from the prod environment's secrets: ${missing[*]}"
            exit 1
          fi

          # Derived values. The workers write Supabase's CA to a file from a base64 secret, and read
          # the R2 keys through the AWS SDK's own variable names; realtime reads the session denylist
          # from the API's Redis, which in this deployment is the same database.
          SUPABASE_CA_CERT_B64="$(printf '%s' "$DATABASE_CA_CERT" | base64 -w0)"
          echo "::add-mask::$SUPABASE_CA_CERT_B64"
          export SUPABASE_CA_CERT_B64
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export AUTH_REDIS_URL="$REDIS_URL"

          # stage APP NAME... : stage each named variable that has a value, under the same name.
          stage() {
            local app="$1"
            shift
            local pairs=()
            for name in "$@"; do
              if [ -n "${!name:-}" ]; then pairs+=("$name=${!name}"); fi
            done
            flyctl secrets set --stage --app "$app" "${pairs[@]}" > /dev/null
            echo "$app: ${#pairs[@]} secrets staged"
          }

          # No DATABASE_USER: migrations connect directly as plain `postgres` (migrate.toml [env]),
          # and a secret of that name would override it with the pooler's `postgres.<ref>`.
          stage studafy-core-migrate DATABASE_PASSWORD DATABASE_CA_CERT

          stage studafy-core-api DATABASE_USER DATABASE_PASSWORD DATABASE_CA_CERT REDIS_URL \
            S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY SENTRY_DSN \
            RECORDS_ENCRYPTION_KEYS RECORDS_ENCRYPTION_CURRENT_KEY_ID WS_JWT_SECRET \
            JWT_PRIVATE_KEY_PEM JWT_NEXT_PRIVATE_KEY_PEM \
            TURNSTILE_SECRET_KEY AI_LLM_API_KEY RESEND_WEBHOOK_SECRET \
            GOOGLE_PLAY_SERVICE_ACCOUNT GOOGLE_PLAY_RTDN_TOKEN \
            GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET \
            MICROSOFT_OAUTH_CLIENT_ID MICROSOFT_OAUTH_CLIENT_SECRET \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS

          stage studafy-core-realtime REDIS_URL AUTH_REDIS_URL SENTRY_DSN WS_JWT_SECRET \
            OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS

          stage studafy-core-workers DATABASE_USER DATABASE_PASSWORD SUPABASE_CA_CERT_B64 REDIS_URL \
            S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SENTRY_DSN \
            RECORDS_ENCRYPTION_KEYS RECORDS_ENCRYPTION_CURRENT_KEY_ID \
            AI_LLM_API_KEY RESEND_API_KEY FIREBASE_SERVICE_ACCOUNT STRIPE_SECRET_KEY \
            GOOGLE_PLAY_SERVICE_ACCOUNT \
            OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS

      - name: Record the images running now (the rollback targets)
        id: previous
        run: |
          set -euo pipefail
          for app in api realtime workers web; do
            echo "$app=$(scripts/deploy/release.sh current-image "studafy-core-$app")" >> "$GITHUB_OUTPUT"
          done

      - name: Build the app images once
        id: images
        run: |
          set -euo pipefail
          flyctl auth docker
          build() { scripts/deploy/release.sh build "studafy-core-$1" "infra/fly/$1.toml" "$RELEASE" "${@:2}"; }
          echo "api=$(build api)" >> "$GITHUB_OUTPUT"
          echo "realtime=$(build realtime)" >> "$GITHUB_OUTPUT"
          echo "workers=$(build workers)" >> "$GITHUB_OUTPUT"
          echo "web=$(build web \
            --build-arg "VITE_RELEASE_VERSION=$RELEASE" \
            --build-arg "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}" \
            --build-arg "VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}" \
            --build-arg "SENTRY_ORG=${{ vars.SENTRY_ORG }}" \
            --build-arg "SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}" \
            ${SENTRY_AUTH_TOKEN:+--build-secret "sentry_auth_token=$SENTRY_AUTH_TOKEN"})" >> "$GITHUB_OUTPUT"
        env:
          # Source maps upload to Sentry only when the token is there (web.Dockerfile mounts it as a
          # BuildKit secret, so it never lands in the image).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # The exact digests about to be released, scanned before anything changes in production.
      - name: Scan the api image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Scan the realtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.realtime }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Scan the workers image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.workers }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.web }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

      - name: Deploy the virus scanner
        run: flyctl deploy . --config infra/fly/scanner.toml --remote-only

      - name: Run database migrations
        run: |
          set -euo pipefail
          app=studafy-core-migrate
          flyctl deploy . --config infra/fly/migrate.toml --remote-only --build-only --push \
            --image-label "$RELEASE"

          # `machine run` applies the app's secrets but not migrate.toml's [env] (only `fly deploy`
          # does), so pass that table explicitly; migrate.toml stays its single source.
          env_args=()
          while IFS= read -r pair; do env_args+=(--env "$pair"); done < <(python3 -c '
          import sys, tomllib
          with open("infra/fly/migrate.toml", "rb") as f:
              for key, value in tomllib.load(f).get("env", {}).items():
                  print(f"{key}={value}")
          ')
          if [ "${#env_args[@]}" -eq 0 ]; then
            echo "::error::No [env] read from infra/fly/migrate.toml."
            exit 1
          fi

          # A named, non-restarting machine, kept until its exit code has been read.
          name="migrate-${RELEASE:0:12}-${GITHUB_RUN_ATTEMPT}"
          machine_id() {
            flyctl machine list --app "$app" --json | jq -r --arg n "$name" '.[] | select(.name == $n) | .id'
          }
          # The image was pushed seconds ago, and the registry region serving the launch can still
          # answer MANIFEST_UNKNOWN for it (seen on the first production run), creating no machine;
          # only then is the launch retried. `machine run` also reports a failure when a run with
          # nothing to apply exits before it is seen started, so a machine that exists counts as
          # launched, and its exit code below decides the outcome; migrations never run twice.
          id=""
          for attempt in 1 2 3 4 5 6; do
            flyctl machine run "registry.fly.io/$app:$RELEASE" --app "$app" --region fra \
              --name "$name" --restart no --detach "${env_args[@]}" || true
            id="$(machine_id)"
            if [ -n "$id" ]; then break; fi
            echo "::warning::Migration machine did not launch (attempt $attempt); retrying."
            sleep $((attempt * 10))
          done
          if [ -z "$id" ]; then
            echo "::error::The migration machine never launched; nothing was released."
            exit 1
          fi
          flyctl machine wait "$id" --app "$app" --state stopped --wait-timeout 15m
          # fly omits exit_code from the exit event when it is 0 (a clean run's event carries only
          # the signal and the time), so an exit event without one means success; no exit event at
          # all stays "unknown". The machine can also report "stopped" a moment before its exit
          # event is listed, so wait for the event, up to 30 seconds, before deciding.
          code=unknown
          for _ in $(seq 1 10); do
            code="$(flyctl machine list --app "$app" --json | jq -r --arg id "$id" \
              '[.[] | select(.id == $id) | .events[]? | select(.type == "exit") | (.request.exit_event.exit_code // 0)][0] // "unknown"')"
            if [ "$code" != "unknown" ]; then break; fi
            sleep 3
          done
          flyctl logs --app "$app" --machine "$id" --no-tail || true
          flyctl machine destroy "$id" --app "$app" --force
          if [ "$code" != "0" ]; then
            echo "::error::Migrations exited with $code; nothing was released."
            exit 1
          fi

      - name: Deploy the API
        id: deploy_api
        run: scripts/deploy/release.sh deploy studafy-core-api infra/fly/api.toml "${{ steps.images.outputs.api }}" --env "RELEASE_VERSION=$RELEASE"

      - name: Deploy the realtime gateway
        run: scripts/deploy/release.sh deploy studafy-core-realtime infra/fly/realtime.toml "${{ steps.images.outputs.realtime }}" --env "RELEASE_VERSION=$RELEASE"

      - name: Deploy the workers
        run: scripts/deploy/release.sh deploy studafy-core-workers infra/fly/workers.toml "${{ steps.images.outputs.workers }}" --env "RELEASE_VERSION=$RELEASE"

      - name: Deploy the web app
        run: scripts/deploy/release.sh deploy studafy-core-web infra/fly/web.toml "${{ steps.images.outputs.web }}"

      - name: Smoke check
        run: scripts/deploy/release.sh smoke https://studafy-core-api.fly.dev https://studafy-core-web.fly.dev

      # Anything after the API deploy started failed: put every service back on the digest it ran
      # before this workflow. A service with no recorded digest (first release) is left as it is.
      - name: Roll back to the previous images
        if: ${{ failure() && steps.deploy_api.outcome != 'skipped' }}
        run: |
          set -uo pipefail
          status=0
          for app in api realtime workers web; do
            case "$app" in
              api) image="${{ steps.previous.outputs.api }}" ;;
              realtime) image="${{ steps.previous.outputs.realtime }}" ;;
              workers) image="${{ steps.previous.outputs.workers }}" ;;
              web) image="${{ steps.previous.outputs.web }}" ;;
            esac
            if [ -z "$image" ]; then
              echo "::warning::No previous image recorded for studafy-core-$app; left as is."
              continue
            fi
            echo "Rolling studafy-core-$app back to $image"
            scripts/deploy/release.sh deploy "studafy-core-$app" "infra/fly/$app.toml" "$image" || status=1
          done
          echo "::error::Release $RELEASE failed and was rolled back. Migrations are not reverted."
          exit $status
