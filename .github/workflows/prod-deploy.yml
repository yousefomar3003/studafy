name: Production deploy

# Manual, approval-gated production release — the deliberate human counterpart to staging-deploy.yml's
# automatic every-merge pipeline. Same building blocks, same order, same scripts: build + sign
# (release.yml, environment: prod), a migration gate (migrate.sh), a rolling update with health
# checks (deploy.sh + each ecs/*/service.json.tpl's minimumHealthyPercent: 100 /
# deploymentCircuitBreaker), and auto-rollback (rollback.sh). Three things staging does not have:
#
#   1. An approval gate. The `gate` job targets the `prod` GitHub Environment; that environment's
#      required-reviewers protection rule (configured in repo settings, not in this file) is what
#      makes "prod deploy requires approval" enforceable — no job after `gate` starts until a
#      reviewer approves the run.
#   2. Synthetic checks asserted *during* the rolling update (the `synthetics` job, which runs
#      alongside `deploy` and fails the run on any non-200 or stale realtime probe seen mid-rollout).
#   3. A post-deploy verification window (`verify`) that watches the ALB target 5xx rate and
#      auto-halts — failing the run, which triggers `rollback` — on an error-rate regression.
#
# DORA signals (deployment count, change-failure flag, lead time, time-to-restore, deploy duration)
# are emitted to the Studafy/DORA CloudWatch namespace by the always-run `dora` job.
#
# The images for `tag` are built into prod's own registry by the `build` job (release.yml, the same
# reusable job staging-deploy.yml calls) rather than promoting staging's — dev/staging/prod each have
# separate registries and signing keys (module.registry, one instantiation per environment). A `tag`
# whose commit predates a required migration image still fails closed at `cosign verify` in
# `migrate`. Full runbook: docs/runbooks/deploy-rollback.md's "Production deploy" section.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag to release, normally a commit SHA on main. Built into prod's registry by this run.
        required: true
      verification_window_minutes:
        description: Minutes to watch the ALB target 5xx rate after the rollout before confirming the deploy.
        required: false
        default: "10"
      error_rate_threshold:
        description: Fraction of target responses allowed to be 5xx before the verification window auto-halts and rolls back (0.02 = 2%).
        required: false
        default: "0.02"

permissions:
  contents: read
  id-token: write
  # gh issue create — the interim alert channel, identical to staging-deploy.yml's: no
  # Slack/PagerDuty/SNS topic exists in this repo to page into yet (docs/runbooks/
  # pgbouncer-conventions.md's "Known gaps" flags the same for the ClientsWaiting alarm).
  issues: write

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  # infra/deploy/scripts/*.sh all key off IMAGE_TAG. release.yml is the tagging authority; this just
  # carries the dispatched value everywhere the scripts and annotate step need it.
  IMAGE_TAG: ${{ inputs.tag }}

jobs:
  # --- Approval gate ---------------------------------------------------------------------------
  # The one job deliberately NOT guarded by AWS_DEPLOYMENTS_ENABLED: the `prod` environment's
  # required-reviewers rule must be exercised on every dispatch, even one that then no-ops because
  # deployments are disabled. Records the approval time so `dora` can measure deploy duration and
  # time-to-restore against it.
  gate:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      started_at: ${{ steps.mark.outputs.started_at }}
    steps:
      - id: mark
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Production deploy of $IMAGE_TAG approved; proceeding." >&2

  # --- Build + sign --------------------------------------------------------------------------------
  # Builds, pushes and cosign-signs all six images (api/realtime/workers/web/erpnext/migrations) into
  # prod's registry — same reusable job, same matrix, as staging-deploy.yml's `build`.
  build:
    needs: gate
    uses: ./.github/workflows/release.yml
    with:
      environment: prod
      tag: ${{ inputs.tag }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # --- Migrate (the gate) -----------------------------------------------------------------------
  # migrate.sh runs the signed migrations image as a one-off Fargate task; a non-zero exit (a failed
  # statement, or packages/db/src/runner.ts's pg_try_advisory_lock finding another migration holding
  # the lock) fails this job before any `deploy` job runs. Nothing beyond job ordering is needed for
  # the gate — migrate.sh halts on its own non-zero exit (see that script's header comment).
  migrate:
    needs: build
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below is pinned to a commit SHA, not a mutable major tag: this file is new to
      # the diff, so semgrep's github-actions-mutable-action-tag rule (the SAST job) catches every
      # line — same reasoning, and the same pinned SHAs, as staging-deploy.yml (commit 845010d). The
      # trailing comment names the release each SHA resolved to as of this writing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Reuses deploy.yml's role choice, not a new one — see infra/deploy/README.md's "Known
          # gaps" #5 for why no more narrowly-scoped deploy role exists yet.
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install deployment utilities
        run: sudo apt-get update && sudo apt-get install -y gettext-base jq
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - run: ./scripts/migrate.sh prod "$IMAGE_TAG"
        working-directory: infra/deploy

  alert-migration-failed:
    needs: migrate
    if: failure() && needs.migrate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Production deploy halted: migration failed ($IMAGE_TAG)" \
            --label "deploy-failure" \
            --body "$(cat <<EOF
          migrate.sh failed for prod at commit $IMAGE_TAG — the deploy halted before any service was
          touched.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Runbook: docs/runbooks/deploy-rollback.md#production-deploy
          EOF
          )"

  # --- API reference site deploy (ST-269) ---------------------------------------------------------
  # Same job as staging-deploy.yml's `deploy-docs` — see that file's comment for the full rationale
  # (the docs/api/ prefix sharing module.cdn's web-bundle bucket, the two-role-assumption pattern,
  # and the known ".../latest/" trailing-slash caching gap). Gated on `build` alone: like the rolling
  # deploy below, nothing here runs before the prod approval gate, because `build` itself needs it.
  deploy-docs:
    needs: build
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-workspace
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - name: Resolve the CDN deploy target
        id: cdn
        run: |
          echo "bucket=$(terraform -chdir=infra/terraform output -raw cdn_web_bundle_bucket_id)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform -chdir=infra/terraform output -raw cdn_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "role=$(terraform -chdir=infra/terraform output -raw cdn_deploy_role_arn)" >> "$GITHUB_OUTPUT"
      - name: Assume the CDN deploy role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ steps.cdn.outputs.role }}
          aws-region: eu-central-1
      - name: Build the reference site
        env:
          DOCS_API_RELEASE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          bun run --cwd apps/api openapi:generate
          bun run --cwd apps/docs-api build
      - name: Publish the reference site
        run: |
          aws s3 sync apps/docs-api/dist "s3://${{ steps.cdn.outputs.bucket }}/docs/api/$IMAGE_TAG" --delete
          aws s3 sync apps/docs-api/dist "s3://${{ steps.cdn.outputs.bucket }}/docs/api/latest" --delete
      - name: Invalidate the previous "latest"
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cdn.outputs.distribution }}" \
            --paths "/docs/api/latest/*"

  # --- Deploy (rolling update) -----------------------------------------------------------------
  # Each service is verified, registered and rolled independently (deploy.sh; no "deploy everything"
  # wrapper). The rolling behaviour — never below desiredCount healthy tasks, ECS circuit-breaker
  # auto-revert if a revision never stabilizes — is entirely ecs/*/service.json.tpl's
  # deploymentConfiguration (prod.env sets minimumHealthyPercent 100 / maximumPercent 200); this job
  # only invokes the script that applies it.
  deploy:
    needs: migrate
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    strategy:
      matrix:
        service: [api, realtime, workers]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Install deployment utilities
        run: sudo apt-get update && sudo apt-get install -y gettext-base jq
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - run: ./scripts/deploy.sh ${{ matrix.service }} prod "$IMAGE_TAG"
        working-directory: infra/deploy

  # --- Synthetic checks during the rolling update -------------------------------------------------
  # Runs in parallel with `deploy` (both need: migrate). Polls the real prod edge's /healthz+/readyz
  # and the already-running synthetic realtime probe (modules/monitoring) every 10s, stopping as soon
  # as all three ECS services report a settled (COMPLETED) primary deployment. Any non-200 or stale
  # probe seen while the rollout is in flight fails the job — the "synthetic checks stay green during
  # rolling update" acceptance criterion — which triggers `rollback`.
  synthetics:
    needs: migrate
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Install deployment utilities
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - name: Poll synthetics until the rollout settles
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          api="https://$(terraform output -raw edge_domain_name)"
          cluster="$(terraform output -raw compute_ecs_cluster_name)"
          prefix="$(terraform output -raw name_prefix)"
          services="$prefix-api $prefix-realtime $prefix-workers"

          # Self-bounded so the job never hangs if the rollout stalls; timeout-minutes is the backstop.
          deadline=$(( $(date +%s) + 20 * 60 ))
          checks=0
          failures=0
          stale_streak=0
          # This job and `deploy` both start on `needs: migrate`, so the first polls can land before
          # ECS reports the new deployment. `observed` gates the early exit: don't stop until we have
          # either watched the rollout in progress or polled for ~2 min, so "green during the
          # rollout" is actually exercised and not skipped past.
          observed=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # HTTP is the hard signal: any non-200 through the edge during the rollout is a failure.
            for path in /healthz /readyz; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$api$path" || echo 000)
              checks=$((checks + 1))
              if [ "$code" != "200" ]; then
                failures=$((failures + 1))
                echo "::warning::synthetic $path returned $code during rollout" >&2
              fi
            done

            # Probe freshness is the soft signal: one missed datapoint can be a CloudWatch lag or a
            # single probe miss, so only a two-in-a-row gap counts as a failure.
            since=$(date -u -d '3 minutes ago' +%Y-%m-%dT%H:%M:%S)
            now=$(date -u +%Y-%m-%dT%H:%M:%S)
            fresh=$(aws cloudwatch get-metric-statistics \
              --namespace Studafy/Realtime --metric-name RealtimeProbeLatency \
              --start-time "$since" --end-time "$now" --period 60 --statistics Maximum \
              --query 'length(Datapoints)' --output text || echo 0)
            if [ "$fresh" = "0" ]; then
              stale_streak=$((stale_streak + 1))
              if [ "$stale_streak" -ge 2 ]; then
                failures=$((failures + 1))
                echo "::warning::realtime probe reported no datapoint for two consecutive polls during rollout" >&2
              fi
            else
              stale_streak=0
            fi

            # Settle = all three services exist and their primary deployment is COMPLETED. Requiring
            # the count guards the first-ever deploy, where a service may not be created yet when
            # this job (which starts with `deploy`) takes its first look.
            counts=$(aws ecs describe-services --cluster "$cluster" --services $services \
              --query "[length(services), length(services[?deployments[0].rolloutState == 'COMPLETED'])]" --output text || echo "0 0")
            read -r total settled <<< "$counts"
            if [ "$total" = "3" ] && [ "$settled" != "3" ]; then
              observed=1
            elif [ "$checks" -ge 24 ]; then
              observed=1
            fi
            if [ "$total" = "3" ] && [ "$settled" = "3" ] && [ "$observed" = "1" ]; then
              echo "rollout settled for all services after $checks checks" >&2
              break
            fi
            sleep 10
          done

          echo "$checks synthetic checks during rollout, $failures failed"
          [ "$failures" -eq 0 ]

  # --- Post-deploy verification window --------------------------------------------------------------
  # Once the rollout has settled and stayed green, watch the api+realtime ALB target groups' 5xx rate
  # for `verification_window_minutes`. Two consecutive one-minute samples above `error_rate_threshold`
  # — or one hard /healthz failure — auto-halt: this job exits non-zero, which triggers `rollback`.
  # This is the "auto-halt on error-rate regression" / game-day induced-failure path.
  verify:
    needs: [deploy, synthetics]
    if: vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    # Safety ceiling only; the watch loop self-bounds to verification_window_minutes.
    timeout-minutes: 120
    env:
      VERIFICATION_WINDOW_MINUTES: ${{ inputs.verification_window_minutes }}
      ERROR_RATE_THRESHOLD: ${{ inputs.error_rate_threshold }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Install deployment utilities
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - name: Watch the target 5xx rate
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          : "${VERIFICATION_WINDOW_MINUTES:?}" "${ERROR_RATE_THRESHOLD:?}"
          api="https://$(terraform output -raw edge_domain_name)"

          # CloudWatch's LoadBalancer/TargetGroup dimensions are the ARN suffixes (app/... and
          # targetgroup/...), which are the tails of the ARNs terraform already outputs.
          lb_arn="$(terraform output -raw edge_alb_arn)"
          lb_suffix="${lb_arn##*:loadbalancer/}"
          api_tg="$(terraform output -raw compute_api_target_group_arn)"
          rt_tg="$(terraform output -raw compute_realtime_target_group_arn)"
          tg_suffixes="targetgroup/${api_tg##*:targetgroup/} targetgroup/${rt_tg##*:targetgroup/}"

          deadline=$(( $(date +%s) + VERIFICATION_WINDOW_MINUTES * 60 ))
          required_consecutive=2
          regressions=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 60

            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$api/healthz" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::/healthz returned $code inside the verification window — auto-halting" >&2
              exit 1
            fi

            start=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%S)
            end=$(date -u +%Y-%m-%dT%H:%M:%S)
            errors=0
            requests=0
            # A transient CloudWatch error must not by itself roll prod back: on a failed call this
            # tick's sample is treated as 0 (|| echo ""), and a real regression is still caught on
            # the next tick — that is what `required_consecutive` is for.
            for tg in $tg_suffixes; do
              e=$(aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB \
                --metric-name HTTPCode_Target_5XX_Count \
                --dimensions Name=LoadBalancer,Value="$lb_suffix" Name=TargetGroup,Value="$tg" \
                --start-time "$start" --end-time "$end" --period 300 --statistics Sum \
                --query 'Datapoints[].Sum' --output text || echo "")
              r=$(aws cloudwatch get-metric-statistics --namespace AWS/ApplicationELB \
                --metric-name RequestCount \
                --dimensions Name=LoadBalancer,Value="$lb_suffix" Name=TargetGroup,Value="$tg" \
                --start-time "$start" --end-time "$end" --period 300 --statistics Sum \
                --query 'Datapoints[].Sum' --output text || echo "")
              errors=$(awk -v a="$errors" -v b="${e:-0}" 'BEGIN{s=a;n=split(b,x);for(i=1;i<=n;i++)s+=x[i];print s}')
              requests=$(awk -v a="$requests" -v b="${r:-0}" 'BEGIN{s=a;n=split(b,x);for(i=1;i<=n;i++)s+=x[i];print s}')
            done

            rate=$(awk -v e="$errors" -v r="$requests" 'BEGIN{ if (r + 0 > 0) printf "%.5f", e / r; else print 0 }')
            echo "verification window: 5xx=$errors requests=$requests error_rate=$rate threshold=$ERROR_RATE_THRESHOLD"

            if awk -v x="$rate" -v t="$ERROR_RATE_THRESHOLD" 'BEGIN{ exit !(x + 0 > t + 0) }'; then
              regressions=$((regressions + 1))
              echo "::warning::error-rate regression $regressions/$required_consecutive" >&2
              if [ "$regressions" -ge "$required_consecutive" ]; then
                echo "::error::error rate $rate exceeded $ERROR_RATE_THRESHOLD for $required_consecutive consecutive samples — auto-halting production deploy" >&2
                exit 1
              fi
            else
              regressions=0
            fi
          done

          echo "verification window clean for ${VERIFICATION_WINDOW_MINUTES}m — production deploy confirmed"

  # --- Auto-rollback -----------------------------------------------------------------------------
  # rollback.sh defaults to "current revision - 1" — the revision `deploy` replaced minutes earlier
  # (docs/runbooks/deploy-rollback.md). Fires when synthetics failed mid-rollout or the verification
  # window auto-halted. Does NOT revert the migration — packages/db's runner is forward-only by
  # design (infra/deploy/README.md), so every migration must stay backward-compatible with the
  # previous release. A `deploy` job that never stabilizes is auto-reverted by the ECS circuit
  # breaker instead, so this job's `if` covers only the synthetics/verify failure shapes.
  rollback:
    needs: [deploy, synthetics, verify]
    if: always() && vars.AWS_DEPLOYMENTS_ENABLED == 'true' && (needs.synthetics.result == 'failure' || needs.verify.result == 'failure')
    environment: prod
    strategy:
      matrix:
        service: [api, realtime, workers]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - run: ./scripts/rollback.sh ${{ matrix.service }} prod
        working-directory: infra/deploy

  alert-rollout-halted:
    needs: [synthetics, verify, rollback]
    if: always() && (needs.synthetics.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SYNTHETICS_RESULT: ${{ needs.synthetics.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Production deploy halted and rolled back ($IMAGE_TAG)" \
            --label "deploy-failure" \
            --body "$(cat <<EOF
          Production deploy of $IMAGE_TAG was halted (synthetics: $SYNTHETICS_RESULT, verify:
          $VERIFY_RESULT) and api/realtime/workers were rolled back one task-definition revision
          (rollback: $ROLLBACK_RESULT). The schema was NOT reverted — confirm the previous release is
          compatible with it.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Runbook: docs/runbooks/deploy-rollback.md#production-deploy
          EOF
          )"

  # --- DORA metrics (always) --------------------------------------------------------------------
  # One PutMetricData call to the Studafy/DORA namespace per run. Nothing graphs these yet — emitted
  # now so the history exists when a dashboard is added, the same "mechanism ahead of its consumer"
  # pattern modules/monitoring's deploy log group already follows. The role this assumes
  # (AWS_APPLY_ROLE_ARN today — infra/deploy/README.md's "Known gaps" #5) needs
  # cloudwatch:PutMetricData; least-privilege scoping is that same follow-up.
  #   Deployments                  1 per run (deployment frequency)
  #   DeploymentFailed             1 if the deploy failed or was rolled back, else 0 (change-failure rate = its average)
  #   DeploymentDurationSeconds    approval -> pipeline end
  #   LeadTimeForChangesSeconds    commit timestamp -> pipeline end, successful deploys only
  #   TimeToRestoreServiceSeconds  approval -> pipeline end, emitted only when a rollback ran
  # "pipeline end" is this job's start; it trails the deploy by the alert/rollback jobs' runtime,
  # which is acceptable slack for release telemetry.
  dora:
    needs: [gate, migrate, deploy, synthetics, verify, rollback]
    if: always() && vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git show <tag>` can resolve the commit timestamp for lead time.
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Emit DORA metrics
        env:
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SYNTHETICS: ${{ needs.synthetics.result }}
          VERIFY: ${{ needs.verify.result }}
          ROLLBACK: ${{ needs.rollback.result }}
          STARTED_AT: ${{ needs.gate.outputs.started_at }}
        run: |
          set -euo pipefail
          now=$(date +%s)

          failed=0
          [ "$MIGRATE" = "success" ] && [ "$DEPLOY" = "success" ] \
            && [ "$SYNTHETICS" = "success" ] && [ "$VERIFY" = "success" ] || failed=1

          restored=""
          if [ "$ROLLBACK" = "success" ] || [ "$ROLLBACK" = "failure" ]; then
            failed=1
            restored=$((now - STARTED_AT))
          fi

          lead=""
          if [ "$failed" -eq 0 ] && commit_ts=$(git show -s --format=%ct "$IMAGE_TAG" 2>/dev/null); then
            lead=$((now - commit_ts))
          fi
          duration=$((now - STARTED_AT))

          dims='[{"Name":"Environment","Value":"prod"}]'
          data='[]'
          add() { data=$(jq -c --argjson d "$1" '. + [$d]' <<<"$data"); }
          add "{\"MetricName\":\"Deployments\",\"Value\":1,\"Unit\":\"Count\",\"Dimensions\":$dims}"
          add "{\"MetricName\":\"DeploymentFailed\",\"Value\":$failed,\"Unit\":\"Count\",\"Dimensions\":$dims}"
          add "{\"MetricName\":\"DeploymentDurationSeconds\",\"Value\":$duration,\"Unit\":\"Seconds\",\"Dimensions\":$dims}"
          if [ -n "$lead" ]; then
            add "{\"MetricName\":\"LeadTimeForChangesSeconds\",\"Value\":$lead,\"Unit\":\"Seconds\",\"Dimensions\":$dims}"
          fi
          if [ -n "$restored" ]; then
            add "{\"MetricName\":\"TimeToRestoreServiceSeconds\",\"Value\":$restored,\"Unit\":\"Seconds\",\"Dimensions\":$dims}"
          fi

          echo "$data" | jq .
          aws cloudwatch put-metric-data --namespace Studafy/DORA --metric-data "$data"

  # --- Deploy annotation (always) --------------------------------------------------------------
  # One line to modules/monitoring's deploy log group regardless of outcome, rendered by the
  # operations dashboard's "Recent deploys" widget — same annotate-deploy.sh, same widget, as
  # staging-deploy.yml.
  annotate:
    needs: [migrate, deploy, synthetics, verify, rollback]
    if: always() && vars.AWS_DEPLOYMENTS_ENABLED == 'true'
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Install deployment utilities
        run: sudo apt-get update && sudo apt-get install -y jq
      - run: terraform init -reconfigure -backend-config=environments/prod/backend.hcl
        working-directory: infra/terraform
      - name: Determine outcome
        id: outcome
        env:
          MIGRATE: ${{ needs.migrate.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SYNTHETICS: ${{ needs.synthetics.result }}
          VERIFY: ${{ needs.verify.result }}
          ROLLBACK: ${{ needs.rollback.result }}
        run: |
          if [ "$MIGRATE" != "success" ]; then
            status="migration_failed"
          elif [ "$DEPLOY" != "success" ]; then
            status="deploy_failed"
          elif [ "$SYNTHETICS" != "success" ]; then
            status="synthetics_failed_rolled_back_${ROLLBACK}"
          elif [ "$VERIFY" != "success" ]; then
            status="verification_halted_rolled_back_${ROLLBACK}"
          else
            status="succeeded"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - env:
          SERVICES: api,realtime,workers
          ACTOR: ${{ github.actor }}
        run: |
          ./scripts/annotate-deploy.sh prod "${{ steps.outcome.outputs.status }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        working-directory: infra/deploy
