name: Mobile release

# The mobile counterpart to fly-production-deploy.yml (ST-257). fastlane
# (apps/mobile/fastlane/Fastfile) owns every store interaction; this workflow only decides which
# lane runs when, and prepares the build inputs Flutter needs.
#
#   push to main (apps/mobile/**)   → android internal  + ios beta    — internal builds auto-distribute
#   push tag mobile-v*              → android release    + ios release — staged store submission
#   workflow_dispatch(rollout)      → android promote_rollout          — advance the live rollout
#
# Every job fails fast with a named error when its store credentials are absent, the same posture
# mobile-integration.yml takes for its Firebase Test Lab secrets — never a silent skip.
#
# Every `uses:` is pinned to a commit SHA, not a mutable tag: this file is new to the diff, so
# semgrep's github-actions-mutable-action-tag rule (ci.yml's SAST job) catches every line. The trailing comment names the release each SHA is.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-release.yml"
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      rollout:
        description: "Play production rollout fraction to advance to, 0..1 (1.0 completes it)."
        required: true
        default: "0.25"

permissions:
  contents: read

concurrency:
  # One release action at a time; never cancel one mid-upload.
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8" # in step with ci.yml / mobile-integration.yml
  # A release (not beta) Xcode on the xcode-27 runner image; App Store submissions reject beta SDKs.
  XCODE_VERSION: "27.2"
  RUBY_VERSION: "3.3"
  # Sentry project `flutter` (studafy-limited) — the Fastfile bakes it in as --dart-define=SENTRY_DSN.
  # A public client key; empty leaves crash reporting to Sentry off.
  SENTRY_DSN: ${{ vars.MOBILE_SENTRY_DSN }}

jobs:
  # --- Android: internal track on every merge to main -----------------------------------------
  android-internal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: mobile-release-android-internal
    # QA-006: signing and store secrets live in this environment, which only main and
    # mobile-v* tags may deploy to (configured in GitHub; see docs/runbooks/mobile-release.md).
    environment: mobile-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MOBILE_BUILD_NUMBER is the commit count — needs full history

      - name: Verify Play credentials are configured
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=()
          [ -n "$PLAY_STORE_JSON_KEY" ] || missing+=("PLAY_STORE_JSON_KEY")
          [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || missing+=("ANDROID_UPLOAD_KEYSTORE_BASE64")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::mobile release needs these repository secrets: ${missing[*]} — see docs/runbooks/mobile-release.md#secrets"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun-workspace
      - name: Emit apps/api's OpenAPI document (the Dart client generates from it)
        run: bunx turbo run generate --filter=@studafy/api

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies and generate the Dart API client (ST-062)
        working-directory: apps/mobile
        run: |
          flutter pub get
          bun run client:generate

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile

      - name: Write the Firebase config (google-services.json)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Gitignored (the repository is public); the Android build's google-services plugin fails
          # without it. The secret holds the file from Firebase -> Project settings -> Your apps.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set (docs/runbooks/fcm-setup.md)"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: fastlane android internal
        working-directory: apps/mobile
        env:
          # QA-084: uploads the obfuscated build's Dart symbols to Sentry (Fastfile upload_dart_symbols!).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # fastlane's json_key_file wants a path, and the secret is the JSON itself.
          printf '%s' "$PLAY_STORE_JSON_KEY" > fastlane/play-store-key.json
          # The version code / build number is this commit's position in history — monotonic and
          # derivable anywhere, so it never has to be hand-bumped.
          export MOBILE_BUILD_NUMBER="$(git rev-list --count HEAD)"
          bundle exec fastlane android internal

      # The signed bundle, kept so it can be downloaded (gh run download) and uploaded to Play by
      # hand, e.g. to another track. Kept even when the Play upload step failed after the build.
      - name: Keep the signed Android bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: apps/mobile/build/app/outputs/bundle/*Release/*.aab
          if-no-files-found: warn
          retention-days: 14

  # --- iOS: TestFlight on every merge to main -------------------------------------------------
  ios-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: mobile-release-ios-beta
    # ITMS-90725: from April 2027 App Store Connect only accepts builds made with the iOS 27 SDK
    # (Xcode 27). macos-26 tops out at Xcode 26.x, so iOS builds run on GitHub's xcode-27 image,
    # and the first step pins the Xcode release and fails fast if the SDK is ever older.
    # QA-006: signing and store secrets live in this environment, which only main and
    # mobile-v* tags may deploy to (configured in GitHub; see docs/runbooks/mobile-release.md).
    environment: mobile-release
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Select Xcode 27 (iOS 27 SDK, ITMS-90725)
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK ${sdk}"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::iOS SDK ${sdk} is older than 27 — App Store Connect rejects it (ITMS-90725)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify App Store Connect + match credentials are configured
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          missing=()
          [ -n "$APP_STORE_CONNECT_KEY_CONTENT" ] || missing+=("APP_STORE_CONNECT_KEY_CONTENT")
          [ -n "$MATCH_GIT_URL" ] || missing+=("MATCH_GIT_URL")
          [ -n "$MATCH_PASSWORD" ] || missing+=("MATCH_PASSWORD")
          [ -n "$GOOGLE_SERVICE_INFO_PLIST" ] || missing+=("GOOGLE_SERVICE_INFO_PLIST")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::mobile release needs these repository secrets: ${missing[*]} — see docs/runbooks/mobile-release.md#secrets"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun-workspace
      - name: Emit apps/api's OpenAPI document (the Dart client generates from it)
        run: bunx turbo run generate --filter=@studafy/api

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies and generate the Dart API client (ST-062)
        working-directory: apps/mobile
        run: |
          flutter pub get
          bun run client:generate

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile

      - name: fastlane ios beta
        working-directory: apps/mobile
        env:
          # QA-084: uploads the obfuscated build's Dart symbols to Sentry (Fastfile upload_dart_symbols!).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          export MOBILE_BUILD_NUMBER="$(git rev-list --count HEAD)"
          bundle exec fastlane ios beta

  # --- Android: production @ 10% staged rollout on a mobile-v* tag ---------------------------
  android-release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    name: mobile-release-android-store
    # QA-006: signing and store secrets live in this environment, which only main and
    # mobile-v* tags may deploy to (configured in GitHub; see docs/runbooks/mobile-release.md).
    environment: mobile-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Play credentials are configured
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=()
          [ -n "$PLAY_STORE_JSON_KEY" ] || missing+=("PLAY_STORE_JSON_KEY")
          [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || missing+=("ANDROID_UPLOAD_KEYSTORE_BASE64")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::mobile release needs these repository secrets: ${missing[*]} — see docs/runbooks/mobile-release.md#secrets"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun-workspace
      - name: Emit apps/api's OpenAPI document (the Dart client generates from it)
        run: bunx turbo run generate --filter=@studafy/api

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies and generate the Dart API client (ST-062)
        working-directory: apps/mobile
        run: |
          flutter pub get
          bun run client:generate

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile

      - name: Write the Firebase config (google-services.json)
        working-directory: apps/mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Gitignored (the repository is public); the Android build's google-services plugin fails
          # without it. The secret holds the file from Firebase -> Project settings -> Your apps.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set (docs/runbooks/fcm-setup.md)"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: fastlane android release (10% rollout)
        working-directory: apps/mobile
        env:
          # QA-084: uploads the obfuscated build's Dart symbols to Sentry (Fastfile upload_dart_symbols!).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MOBILE_RELEASE_TAG: ${{ github.ref_name }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$PLAY_STORE_JSON_KEY" > fastlane/play-store-key.json
          export MOBILE_BUILD_NUMBER="$(git rev-list --count HEAD)"
          bundle exec fastlane android release

      - name: Compute the forced-update floor this release implies
        working-directory: apps/mobile
        run: bundle exec fastlane update_floor

  # --- iOS: App Store review + phased release on a mobile-v* tag -----------------------------
  ios-release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    name: mobile-release-ios-store
    # ITMS-90725: from April 2027 App Store Connect only accepts builds made with the iOS 27 SDK
    # (Xcode 27). macos-26 tops out at Xcode 26.x, so iOS builds run on GitHub's xcode-27 image,
    # and the first step pins the Xcode release and fails fast if the SDK is ever older.
    # QA-006: signing and store secrets live in this environment, which only main and
    # mobile-v* tags may deploy to (configured in GitHub; see docs/runbooks/mobile-release.md).
    environment: mobile-release
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Select Xcode 27 (iOS 27 SDK, ITMS-90725)
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK ${sdk}"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::iOS SDK ${sdk} is older than 27 — App Store Connect rejects it (ITMS-90725)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify App Store Connect + match credentials are configured
        env:
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          missing=()
          [ -n "$APP_STORE_CONNECT_KEY_CONTENT" ] || missing+=("APP_STORE_CONNECT_KEY_CONTENT")
          [ -n "$MATCH_GIT_URL" ] || missing+=("MATCH_GIT_URL")
          [ -n "$MATCH_PASSWORD" ] || missing+=("MATCH_PASSWORD")
          [ -n "$GOOGLE_SERVICE_INFO_PLIST" ] || missing+=("GOOGLE_SERVICE_INFO_PLIST")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::mobile release needs these repository secrets: ${missing[*]} — see docs/runbooks/mobile-release.md#secrets"
            exit 1
          fi

      - uses: ./.github/actions/setup-bun-workspace
      - name: Emit apps/api's OpenAPI document (the Dart client generates from it)
        run: bunx turbo run generate --filter=@studafy/api

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies and generate the Dart API client (ST-062)
        working-directory: apps/mobile
        run: |
          flutter pub get
          bun run client:generate

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile

      - name: fastlane ios release (submit for review, phased release)
        working-directory: apps/mobile
        env:
          # QA-084: uploads the obfuscated build's Dart symbols to Sentry (Fastfile upload_dart_symbols!).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MOBILE_RELEASE_TAG: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          export MOBILE_BUILD_NUMBER="$(git rev-list --count HEAD)"
          bundle exec fastlane ios release

  # --- Android: advance the live production rollout (10% → 25% → 50% → 100%) -----------------
  android-promote-rollout:
    if: github.event_name == 'workflow_dispatch'
    name: mobile-release-android-promote-rollout
    # QA-006: signing and store secrets live in this environment, which only main and
    # mobile-v* tags may deploy to (configured in GitHub; see docs/runbooks/mobile-release.md).
    environment: mobile-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify Play credentials are configured
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::PLAY_STORE_JSON_KEY is not configured — see docs/runbooks/mobile-release.md#secrets"
            exit 1
          fi

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile

      - name: fastlane android promote_rollout
        working-directory: apps/mobile
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          # Via env, never interpolated into the script: `inputs.*` is attacker-controllable and
          # `${{ }}` in a run: block is a shell-injection sink (semgrep run-shell-injection).
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          printf '%s' "$PLAY_STORE_JSON_KEY" > fastlane/play-store-key.json
          export MOBILE_BUILD_NUMBER="$(git rev-list --count HEAD)"
          bundle exec fastlane android promote_rollout "rollout:${ROLLOUT}"
