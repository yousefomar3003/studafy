services:
  postgres:
    # pgvector/pgvector:pg16 is the official pgvector image built on the standard Postgres 16 image,
    # so it ships the `vector` extension plus the contrib modules the migrations use (pgcrypto,
    # pg_trgm, pg_stat_statements). The stock postgres:16-alpine image has no pgvector, so
    # `CREATE EXTENSION vector` would fail against it.
    image: pgvector/pgvector:pg16
    # Preload pg_stat_statements so the disposable local/CI database actually collects statistics and
    # the operational extension tests can query them. On RDS this is the parameter-group setting in
    # infra/terraform/modules/postgres (requires a reboot); here it is a container flag.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: studafy_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for this disposable local database}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studafy_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
