name: studafy-test

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  postgres:
    # pgvector/pgvector:pg16 is the official pgvector image built on the standard Postgres 16 image,
    # so it ships the `vector` extension plus the contrib modules the migrations use (pgcrypto,
    # pg_trgm, pg_stat_statements). The stock postgres:16-alpine image has no pgvector, so
    # `CREATE EXTENSION vector` would fail against it.
    image: pgvector/pgvector:pg16
    # Preload pg_stat_statements so the disposable local/CI database actually collects statistics and
    # the operational extension tests can query them. On RDS this is the parameter-group setting in
    # infra/terraform/modules/postgres (requires a reboot); here it is a container flag.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: studafy_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studafy_test}
      POSTGRES_DB: studafy
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studafy_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    # Docker gives a container 64 MB of /dev/shm by default, and PostgreSQL puts the shared memory for
    # PARALLEL workers there. Building the HNSW index over the 100,000-chunk benchmark corpus (ST-047)
    # asks for a ~530 MB parallel-worker segment and dies with "could not resize shared memory segment
    # ... No space left on device" against the default. This is not a Postgres tuning question -- the
    # server is configured correctly -- it is the container's shm being too small for it.
    shm_size: 1gb
    # The data directory is a tmpfs: this database is disposable, and keeping it in RAM makes the test
    # suite (which creates and drops a database per test) far faster. The size is raised from the default
    # (half of host RAM, but capped low in some CI runners) because the benchmark corpus is genuinely
    # large: 100,000 x 1536 float4 embeddings is ~600 MB of vectors before the HNSW graph is built.
    tmpfs:
      - /var/lib/postgresql/data:size=4g

  # --- Local file uploads (profile "files") ---------------------------------------------------------
  # Started by `bun run db:up` (which passes --profile files), not by CI's plain `docker compose up`,
  # so the database/Redis CI jobs don't wait on a ClamAV signature load they never use.
  # Production uses real S3 through the ECS task roles and a ClamAV sidecar in the workers task
  # (infra/docker/clamav.Dockerfile); these two stand in for them on a developer machine.

  # S3-compatible object storage for the app-files bucket. RustFS rather than MinIO: MinIO's free
  # images are no longer published to Docker Hub or quay.io. The credentials are local-only and bound
  # to 127.0.0.1 — they are deliberately committed, and the .env.example S3_* values match them.
  # `bun run db:up` creates the studafy-files bucket and its browser CORS rule afterwards
  # (apps/api/scripts/init-local-storage.ts).
  s3:
    image: rustfs/rustfs:1.0.1
    profiles: ["files"]
    environment:
      RUSTFS_ACCESS_KEY: studafy-local
      RUSTFS_SECRET_KEY: studafy-local-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API (S3_ENDPOINT)
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Malware scanner the workers' file-scan queue streams uploads through (CLAMAV_HOST=127.0.0.1).
  # Same upstream version as the production sidecar image. The signature database is kept in a volume
  # so only the first `db:up` downloads it; the upstream image's own healthcheck reports healthy once
  # clamd has loaded it (about a minute the first time).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["files"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

  # --- Local ERPNext (profile "erpnext") -------------------------------------------------------------
  # The accounting plane behind /api/finance/* and the Finance dashboard, in the shape
  # infra/terraform/modules/erpnext runs it on ECS: one bench (this repo's infra/docker/erpnext
  # image -- ERPNext + Frappe Education), MariaDB, two Redis, and backend/websocket/queue/scheduler
  # roles behind an nginx frontend that picks the Frappe site from the Host header (one site per
  # school). Opt-in and heavy (~2-3 GB RAM, first build ~4 GB): `bun run erpnext:up` starts it and
  # `bun run erpnext:site` creates the demo school's site. Local-only credentials, bound to
  # 127.0.0.1. ERPNEXT_API_URL=http://127.0.0.1:8080.
  erpnext-db:
    image: mariadb:10.6
    profiles: ["erpnext"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: studafy-local-erp
    volumes:
      - erpnext-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pstudafy-local-erp"]
      interval: 3s
      timeout: 3s
      retries: 30

  erpnext-redis-cache:
    image: redis:7-alpine
    profiles: ["erpnext"]

  erpnext-redis-queue:
    image: redis:7-alpine
    profiles: ["erpnext"]
    volumes:
      - erpnext-redis-queue:/data

  # One-shot: points the bench's common_site_config at the services above, then exits.
  erpnext-configurator:
    image: studafy/erpnext:local
    build: &erpnext-build
      context: ..
      dockerfile: infra/docker/erpnext.Dockerfile
    profiles: ["erpnext"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host erpnext-db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://erpnext-redis-cache:6379 &&
        bench set-config -g redis_queue redis://erpnext-redis-queue:6379 &&
        bench set-config -g redis_socketio redis://erpnext-redis-queue:6379 &&
        bench set-config -gp socketio_port 9000
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-db:
        condition: service_healthy

  erpnext-backend:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: &erpnext-ready
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started

  erpnext-websocket:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-queue:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-scheduler:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["bench", "schedule"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-frontend:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      # The literal `$host`: nginx forwards whatever Host header the caller sent, and bench serves
      # the matching site -- the same site-per-school routing as production.
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - erpnext-backend
      - erpnext-websocket

volumes:
  s3-data:
  clamav-db:
  erpnext-db:
  erpnext-redis-queue:
  erpnext-sites:
