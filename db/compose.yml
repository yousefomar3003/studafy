name: studafy-test

services:
  # The disposable test Postgres and Redis live in the root compose.yml (`test-postgres`,
  # `test-redis`, profile "test"; `bun run db:up`). They used to be duplicated here as unprofiled
  # services on the same ports, so `bun run files:up` / `erpnext:up` also started this file's copies,
  # which took the same container names (project "studafy-test" + "postgres" ==
  # "studafy" + "test-postgres") and made the next `bun run db:up` fail on a name conflict (QA-004).
  # This file now holds only the optional local planes below.

  # --- Local file uploads (profile "files") ---------------------------------------------------------
  # Started by `bun run files:up` (which passes --profile files), not by CI's plain `docker compose up`,
  # so the database/Redis CI jobs don't wait on a ClamAV signature load they never use.
  # Production uses Cloudflare R2 and the ClamAV scanner app (infra/fly/scanner.toml); these two
  # stand in for them on a developer machine.

  # S3-compatible object storage for the app-files bucket. RustFS rather than MinIO: MinIO's free
  # images are no longer published to Docker Hub or quay.io. The credentials are local-only and bound
  # to 127.0.0.1 — they are deliberately committed, and the .env.example S3_* values match them.
  # `bun run db:up` creates the studafy-files bucket and its browser CORS rule afterwards
  # (apps/api/scripts/init-local-storage.ts).
  s3:
    image: rustfs/rustfs:1.0.1
    profiles: ["files"]
    environment:
      RUSTFS_ACCESS_KEY: studafy-local
      RUSTFS_SECRET_KEY: studafy-local-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API (S3_ENDPOINT)
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Malware scanner the workers' file-scan queue streams uploads through (CLAMAV_HOST=127.0.0.1).
  # Same upstream version as the production sidecar image. The signature database is kept in a volume
  # so only the first `db:up` downloads it; the upstream image's own healthcheck reports healthy once
  # clamd has loaded it (about a minute the first time).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["files"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

  # --- Local ERPNext (profile "erpnext") -------------------------------------------------------------
  # The accounting plane behind /api/finance/* and the Finance dashboard, in the shape a
  # hosted ERPNext would run: one bench (this repo's infra/docker/erpnext
  # image -- ERPNext + Frappe Education), MariaDB, two Redis, and backend/websocket/queue/scheduler
  # roles behind an nginx frontend that picks the Frappe site from the Host header (one site per
  # school). Opt-in and heavy (~2-3 GB RAM, first build ~4 GB): `bun run erpnext:up` starts it and
  # `bun run erpnext:site` creates the demo school's site. Local-only credentials, bound to
  # 127.0.0.1. ERPNEXT_API_URL=http://127.0.0.1:8080.
  erpnext-db:
    image: mariadb:10.6
    profiles: ["erpnext"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: studafy-local-erp
    volumes:
      - erpnext-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pstudafy-local-erp"]
      interval: 3s
      timeout: 3s
      retries: 30

  erpnext-redis-cache:
    image: redis:7-alpine
    profiles: ["erpnext"]

  erpnext-redis-queue:
    image: redis:7-alpine
    profiles: ["erpnext"]
    volumes:
      - erpnext-redis-queue:/data

  # One-shot: points the bench's common_site_config at the services above, then exits.
  erpnext-configurator:
    image: studafy/erpnext:local
    build: &erpnext-build
      context: ..
      dockerfile: infra/docker/erpnext.Dockerfile
    profiles: ["erpnext"]
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host erpnext-db &&
        bench set-config -gp db_port 3306 &&
        bench set-config -g redis_cache redis://erpnext-redis-cache:6379 &&
        bench set-config -g redis_queue redis://erpnext-redis-queue:6379 &&
        bench set-config -g redis_socketio redis://erpnext-redis-queue:6379 &&
        bench set-config -gp socketio_port 9000
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-db:
        condition: service_healthy

  erpnext-backend:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: &erpnext-ready
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started

  erpnext-websocket:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-queue:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-scheduler:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["bench", "schedule"]
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on: *erpnext-ready

  erpnext-frontend:
    image: studafy/erpnext:local
    build: *erpnext-build
    profiles: ["erpnext"]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      # The literal `$host`: nginx forwards whatever Host header the caller sent, and bench serves
      # the matching site -- the same site-per-school routing as production.
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - erpnext-backend
      - erpnext-websocket

  # --- All-in-one ERPNext (profile "erpnext-fly") ------------------------------------------------------
  # The production ERPNext machine (infra/fly/erpnext.toml) as one container: MariaDB, Redis,
  # gunicorn, worker, scheduler and the site agent under supervisord, held to the same 2 GB.
  # `bun run erpnext-fly:up` / `erpnext-fly:stop`. The agent creates each approved school's site
  # (it polls the API on this machine); gunicorn picks the site from the Host header:
  #   curl -H 'Host: <slug>.erpnext.localhost' http://127.0.0.1:8090/api/method/ping
  # Local-only credentials, bound to 127.0.0.1. Separate from the "erpnext" profile above (own
  # port and volume); run one or the other.
  erpnext-fly:
    image: studafy/erpnext-fly:local
    build:
      context: ..
      dockerfile: infra/docker/erpnext-fly.Dockerfile
    profiles: ["erpnext-fly"]
    mem_limit: 2g
    # Like fly's kill_timeout (infra/fly/erpnext.toml): time for supervisord to stop everything and
    # MariaDB to shut down cleanly, instead of Docker's 10 s before SIGKILL.
    stop_grace_period: 150s
    # The entrypoint bind-mounts /data/sites over the bench's sites/ (see infra/erpnext/fly/entrypoint.sh),
    # which needs CAP_SYS_ADMIN, and on Linux hosts no AppArmor profile (docker-default denies mount).
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor=unconfined"]
    environment:
      MARIADB_ROOT_PASSWORD: studafy-local-erp
      ERPNEXT_ADMIN_PASSWORD: studafy-local-admin
      STUDAFY_API_URL: http://host.docker.internal:3000
      ERPNEXT_AGENT_TOKEN: studafy-local-erpnext-agent-token-0001
      STUDAFY_ERPNEXT_API_KEY: studafylocalkey01:studafy-local-erpnext-secret
      STUDAFY_ERPNEXT_WEBHOOK_SECRET: studafy-local-erpnext-webhook
      # BACKUP_S3_* unset: the agent skips backups locally.
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop defines it already
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - erpnext-fly-data:/data

volumes:
  s3-data:
  clamav-db:
  erpnext-db:
  erpnext-redis-queue:
  erpnext-sites:
  erpnext-fly-data:
